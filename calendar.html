<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>170 Eldridge — Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0d0a; --card:#161410; --surface-2:#1d1a14; --surface-3:#232019;
  --line:#2b271f; --line-2:#3a352a; --border:var(--line);
  --ink:#f2ede1; --ink2:#d9d2c2; --muted:#9a9080; --muted-2:#6b6353;
  --amber:#eaa23a; --amber-dim:#a87524; --amber-soft:rgba(234,162,58,.12);
  --green:#88b46c; --green-soft:rgba(136,180,108,.14);
  --red:#d3765b; --red-soft:rgba(211,118,91,.14);
  --blue:#7aa0cf; --blue-soft:rgba(122,160,207,.14);
  --violet:#b49bdb; --violet-soft:rgba(180,155,219,.14);
  --display:'Bebas Neue',sans-serif; --mono:'Space Mono',monospace; --body:'Inter',system-ui,sans-serif;
  --new-bg:var(--blue-soft); --new-border:rgba(122,160,207,.35); --new-text:var(--blue);
  --quoted-bg:var(--amber-soft); --quoted-border:var(--amber-dim); --quoted-text:var(--amber);
  --contracted-bg:var(--green-soft); --contracted-border:rgba(136,180,108,.35); --contracted-text:var(--green);
  --invoiced-bg:var(--violet-soft); --invoiced-border:rgba(180,155,219,.35); --invoiced-text:var(--violet);
  --stale:#b08d57; --stale-soft:rgba(176,141,87,.14);
  --stale-bg:var(--stale-soft); --stale-border:rgba(176,141,87,.35); --stale-text:var(--stale);
  --dead-bg:var(--surface-3); --dead-border:var(--line-2); --dead-text:var(--muted-2);
}
html{font-size:15px}
body{font-family:var(--body);background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
::selection{background:var(--amber);color:#0e0d0a}

/* ── AUTH (identical to index.html) ── */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.auth-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:48px 40px;max-width:400px;width:100%;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.45)}
.auth-logo{font-family:var(--display);font-size:1.9rem;letter-spacing:.05em;color:var(--ink);margin-bottom:6px}
.auth-eyebrow{font-family:var(--mono);font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-2);margin-bottom:32px}
.auth-desc{font-size:.875rem;color:var(--muted);line-height:1.65;margin-bottom:32px}
.btn-gsi{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:12px 24px;border-radius:6px;border:1.5px solid var(--line-2);background:#fff;color:#1a1a1a;font-family:var(--body);font-size:.875rem;font-weight:500;cursor:pointer;width:100%;transition:all .15s}
.btn-gsi:hover{opacity:.92;border-color:var(--amber-dim)}
.btn-gsi svg{flex-shrink:0}
.auth-error{margin-top:16px;font-size:.8rem;color:var(--red);background:var(--red-soft);border:1px solid rgba(211,118,91,.35);border-radius:5px;padding:8px 12px;display:none}
.gate-input{width:100%;background:var(--surface-3);border:1px solid var(--line-2);border-radius:6px;padding:12px 14px;font-size:.9rem;color:var(--ink);font-family:inherit;text-align:center;letter-spacing:.1em;transition:.14s}
.gate-input:focus{outline:none;border-color:var(--amber-dim)}
.gate-btn{width:100%;margin-top:14px;background:var(--amber);border:none;border-radius:6px;padding:12px;font-family:var(--body);font-size:.875rem;font-weight:600;color:#140f08;cursor:pointer;transition:.15s}
.gate-btn:hover{background:#f4b04c}

/* ── SHELL ── */
.site-header{background:rgba(14,13,10,.94);backdrop-filter:blur(10px);height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--line)}
.logo{font-family:var(--display);font-size:1.4rem;color:var(--ink);letter-spacing:.05em}
.header-right{display:flex;align-items:center;gap:14px}
.header-tag{font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2)}
.user-chip{font-family:var(--mono);font-size:.65rem;color:var(--muted-2);letter-spacing:.04em}
.header-btn{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:7px 13px;border-radius:5px;border:1px solid var(--line-2);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s}
.header-btn:hover{background:var(--amber-soft);border-color:var(--amber-dim);color:var(--ink)}
.hub-nav{display:flex;gap:4px;padding:10px 32px;background:var(--surface-2);border-bottom:1px solid var(--line);position:sticky;top:60px;z-index:99}
.hub-nav-link{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:7px 14px;border-radius:5px;transition:.15s}
.hub-nav-link:hover{color:var(--ink);background:var(--surface-3)}
.hub-nav-link.active{color:var(--amber);background:var(--amber-soft)}
.page{max-width:1280px;margin:0 auto;padding:32px 24px 80px}

.loading-wrap{display:flex;align-items:center;gap:10px;color:var(--muted);font-family:var(--mono);font-size:.8rem;padding:40px 0;justify-content:center}
.spin{width:14px;height:14px;border:2px solid var(--line-2);border-top-color:var(--amber);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-banner{background:var(--red-soft);border:1px solid rgba(211,118,91,.35);color:var(--red);padding:12px 16px;border-radius:6px;font-size:.85rem;margin-bottom:20px}

/* ── MONTH NAV ── */
.cal-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:14px}
.cal-month-nav{display:flex;align-items:center;gap:10px}
.cal-nav-btn{width:34px;height:34px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface-3);color:var(--ink2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.14s;font-size:16px}
.cal-nav-btn:hover{border-color:var(--amber-dim);background:var(--amber-soft);color:var(--amber)}
.cal-month-label{font-family:var(--display);font-size:1.7rem;letter-spacing:.03em;min-width:220px;text-align:center}
.cal-today-btn{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;padding:8px 14px;border-radius:5px;border:1px solid var(--line-2);background:transparent;color:var(--muted);cursor:pointer;transition:.14s}
.cal-today-btn:hover{border-color:var(--amber-dim);color:var(--amber)}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:.68rem;letter-spacing:.04em;color:var(--muted)}
.cal-legend span{display:inline-flex;align-items:center;gap:5px}
.cal-legend .dot{width:8px;height:8px;border-radius:50%;display:inline-block}

/* ── GRID ── */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--line)}
.cal-dow{background:var(--surface-2);color:var(--muted-2);font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:10px 0}
.cal-cell{background:var(--card);min-height:150px;padding:8px;display:flex;flex-direction:column;gap:4px;position:relative;transition:background .12s}
.cal-cell.pad{background:var(--surface-2);opacity:.45}
.cal-cell.off-pipeline{box-shadow:inset 0 0 0 1.5px var(--red)}
.cal-cell.today{box-shadow:inset 0 0 0 1.5px var(--amber)}
.cal-daynum{font-family:var(--mono);font-size:.72rem;color:var(--muted);display:flex;align-items:center;justify-content:space-between}
.cal-cell.today .cal-daynum{color:var(--amber);font-weight:700}
.cal-flag-wrap{position:relative;display:inline-flex}
.cal-flag{width:6px;height:6px;border-radius:50%;background:var(--red);cursor:pointer}
.cal-popover{display:none;position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--line-2);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.5);padding:6px;min-width:190px;max-width:230px;z-index:50}
.cal-popover.show{display:block}
.cal-cell.pop-open{z-index:60}
.cal-pop-label{font-family:var(--mono);font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;color:var(--red);padding:4px 8px 6px}
.cal-pop-item{display:block;padding:6px 8px;border-radius:4px;text-decoration:none;transition:.12s}
a.cal-pop-item:hover{background:var(--surface-3)}
.cal-pop-time{display:block;font-family:var(--mono);font-size:.6rem;color:var(--muted-2);text-transform:uppercase;letter-spacing:.05em}
.cal-pop-title{display:block;font-size:.78rem;color:var(--ink2);margin-top:1px}
.cal-chip{font-family:var(--mono);letter-spacing:.02em;padding:4px 6px;border-radius:4px;cursor:pointer;transition:.12s;background:var(--surface-3);color:var(--muted)}
.cal-chip:hover{filter:brightness(1.15)}
.cal-chip-name{font-size:.66rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.cal-chip-meta{font-size:.6rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.8;margin-top:1px}
.cal-chip.new{background:var(--new-bg);color:var(--new-text)}
.cal-chip.quoted{background:var(--quoted-bg);color:var(--quoted-text)}
.cal-chip.contracted{background:var(--contracted-bg);color:var(--contracted-text)}
.cal-chip.invoiced{background:var(--invoiced-bg);color:var(--invoiced-text)}
.cal-chip.stale{background:var(--stale-bg);color:var(--stale-text)}
.cal-chip.dead{background:var(--dead-bg);color:var(--dead-text)}
.cal-more{font-family:var(--mono);font-size:.62rem;color:var(--muted-2);padding:2px 6px}

@media(max-width:900px){.page{padding:20px 16px 60px}.cal-cell{min-height:110px}.cal-month-label{font-size:1.3rem;min-width:0}}
@media(max-width:600px){.site-header{padding:0 16px}.hub-nav{padding:8px 16px}.header-tag,.user-chip{display:none}.cal-dow{font-size:.55rem}.cal-cell{padding:5px;min-height:76px}.cal-chip{padding:3px 4px}.cal-chip-name{font-size:.6rem}.cal-chip-meta{display:none}}
</style>
</head>
<body>

<div id="gate-screen" class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">CARRIAGE HOUSE</div>
    <div class="auth-eyebrow">Event Hub</div>
    <div class="auth-desc">Enter the access code to continue.</div>
    <input type="password" class="gate-input" id="gate-input" placeholder="Access code" autocomplete="off" onkeydown="if(event.key==='Enter') checkGate()">
    <button class="gate-btn" id="gate-btn" onclick="checkGate()">Continue</button>
    <div class="auth-error" id="gate-error">Incorrect code. Try again.</div>
  </div>
</div>

<div id="auth-screen" class="auth-wrap" style="display:none">
  <div class="auth-card">
    <div class="auth-logo">CARRIAGE HOUSE</div>
    <div class="auth-eyebrow">Event Hub</div>
    <div class="auth-desc">Sign in with your Google account to view the calendar.</div>
    <button class="btn-gsi" id="signin-btn" onclick="signIn()">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z"/></svg>
      Sign in with Google
    </button>
    <div class="auth-error" id="auth-error"></div>
  </div>
</div>

<div id="app" style="display:none">
  <header class="site-header">
    <div class="logo">CARRIAGE HOUSE</div>
    <div class="header-right">
      <span class="header-tag">Event Hub</span>
      <span class="user-chip" id="user-chip"></span>
      <button class="header-btn" onclick="signOut()">Sign out</button>
    </div>
  </header>

  <nav class="hub-nav">
    <a href="index.html" class="hub-nav-link">Board</a>
    <a href="calendar.html" class="hub-nav-link active">Calendar</a>
    <a href="clients.html" class="hub-nav-link">Clients</a>
    <a href="payments.html" class="hub-nav-link">Payments</a>
  </nav>

  <div class="page">
    <div class="cal-toolbar">
      <div class="cal-month-nav">
        <button class="cal-nav-btn" onclick="shiftMonth(-1)">‹</button>
        <div class="cal-month-label" id="cal-month-label"></div>
        <button class="cal-nav-btn" onclick="shiftMonth(1)">›</button>
        <button class="cal-today-btn" onclick="goToday()">Today</button>
      </div>
      <div class="cal-legend">
        <span><span class="dot" style="background:var(--new-text)"></span>New</span>
        <span><span class="dot" style="background:var(--quoted-text)"></span>Quoted</span>
        <span><span class="dot" style="background:var(--contracted-text)"></span>Contracted</span>
        <span><span class="dot" style="background:var(--invoiced-text)"></span>Invoiced</span>
        <span><span class="dot" style="background:var(--stale-text)"></span>Stale</span>
        <span><span class="dot" style="background:var(--red)"></span>Not on the board</span>
      </div>
    </div>

    <div id="loading-row" class="loading-wrap" style="display:none"><div class="spin"></div> Loading…</div>
    <div id="error-row" class="error-banner" style="display:none"></div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════
// CONFIG -- must match index.html exactly (same Sheet, same columns).
const CONFIG = {
  CLIENT_ID: '515515941640-qvbv3p5mm8j5rt0mkqilgu8sfo2cplmu.apps.googleusercontent.com',
  SHEET_ID:  '10z_FdC74leDuRG8-CR7U4IFzWOM4-1wNueM9D3Dmn3Q',
  TAB:       'Inquiries',
};
const COL = {
  timestamp:0, refId:1, firstName:2, lastName:3, email:4, phone:5,
  company:6, referral:7, eventType:8, eventDate:9, doorsOpen:10,
  doorsClose:11, guestCount:12, doorStaff:13, rooftop:14,
  servicesNeeded:15, outsideVendors:16, guestMethod:17, publicEvent:18,
  alcohol:19, ageReq:20, insurance:21, budget:22, payMethod:23, notes:24,
  status:25, quoteTotal:26, quoteData:27, contractGenerated:28, lastUpdatedBy:29, calendarEventId:30,
  invoiceData:31, invoiceTotal:32, starred:33, followupDate:34,
  lastActivityAt:35, lastAutoDraftAt:36, eventTitle:37,
};
const CAL_ID = '170Eldridge@gmail.com';

let tokenClient, accessToken = null, currentUserEmail = '';
let inquiries = [];
let byDate = {}; // { 'YYYY-MM-DD': [inq, ...] }
let calEventsByDate = {}; // { 'YYYY-MM-DD': [{title,link}] } -- fetched per visible month
let calMonthsFetched = {}; // { 'YYYY-M': true } cache so navigating back doesn't re-fetch
let viewYear, viewMonth; // 0-based month

// ── ACCESS GATE (identical to index.html) ──────────────────────────────
const GATE_CODE = '1395';
const GATE_KEY  = '170e_gate_ok';
function checkGate(){
  const input = document.getElementById('gate-input');
  const err   = document.getElementById('gate-error');
  if (input.value === GATE_CODE) {
    localStorage.setItem(GATE_KEY, '1');
    err.style.display = 'none';
    document.getElementById('gate-screen').style.display = 'none';
    document.getElementById('auth-screen').style.display = 'flex';
  } else {
    err.style.display = 'block';
    input.value = '';
    input.focus();
  }
}

// ── INIT ──────────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  if (localStorage.getItem(GATE_KEY) === '1') {
    document.getElementById('gate-screen').style.display = 'none';
    document.getElementById('auth-screen').style.display = 'flex';
  }
  const today = new Date();
  viewYear = today.getFullYear(); viewMonth = today.getMonth();

  const saved = sessionStorage.getItem('170e_token');
  if (saved) {
    accessToken = saved;
    currentUserEmail = sessionStorage.getItem('170e_user') || '';
    if (currentUserEmail) document.getElementById('user-chip').textContent = currentUserEmail;
    showApp();
    loadInquiries();
  }

  const t = setInterval(() => {
    if (window.google?.accounts?.oauth2) {
      clearInterval(t);
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CONFIG.CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/gmail.compose',
        callback: onToken,
      });
    }
  }, 100);
});

function signIn() {
  if (!tokenClient) { showAuthError('Google Sign-In is still loading — please try again in a moment.'); return; }
  tokenClient.requestAccessToken({ prompt: '' });
}
function onToken(resp) {
  if (resp.error) { showAuthError('Sign-in failed: ' + resp.error); return; }
  accessToken = resp.access_token;
  sessionStorage.setItem('170e_token', accessToken);
  fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers:{ Authorization:`Bearer ${accessToken}` } })
    .then(r=>r.json()).then(info=>{
      currentUserEmail = info.email || '';
      sessionStorage.setItem('170e_user', currentUserEmail);
      document.getElementById('user-chip').textContent = currentUserEmail;
    }).catch(()=>{});
  showApp();
  loadInquiries();
}
function signOut() {
  if (accessToken && window.google?.accounts?.oauth2) google.accounts.oauth2.revoke(accessToken);
  sessionStorage.clear();
  accessToken = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
}
function showApp() {
  document.getElementById('gate-screen').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}
function showAuthError(msg) {
  const el = document.getElementById('auth-error');
  el.textContent = msg; el.style.display = 'block';
}
function handleAuthExpired() {
  accessToken = null;
  sessionStorage.removeItem('170e_token');
  setLoading(false);
  showError('Your session expired. Please sign in again.');
  document.getElementById('app').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
}
function setLoading(show) { document.getElementById('loading-row').style.display = show ? 'flex' : 'none'; }
function showError(msg) { const el=document.getElementById('error-row'); el.textContent=msg; el.style.display='block'; }
function clearError() { document.getElementById('error-row').style.display = 'none'; }

// ── LOAD (read-only -- no writes happen from this page) ────────────────
function safeJson(str) { if (!str) return null; try { return JSON.parse(str); } catch { return null; } }
function escHtml(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function dealValue(inq) {
  if (inq.status === 'invoiced') { const v = parseFloat(inq.invoiceTotal) || 0; if (v > 0) return v; }
  return parseFloat(inq.quoteTotal) || 0;
}
function fmtMoneyShort(n) {
  if (!n) return '';
  if (n >= 1000) return '$' + (Math.round(n/100)/10).toFixed(1).replace(/\.0$/,'') + 'k';
  return '$' + n.toLocaleString();
}
function fmtTimeRange(open, close) {
  // Doors open/close are free text (however it was typed on the intake form
  // or the edit form), so this just joins whatever's on file rather than
  // trying to reparse/reformat it -- safer than guessing at a format that
  // doesn't hold for every entry.
  if (open && close) return open + '–' + close;
  return open || close || '';
}

async function loadInquiries() {
  setLoading(true);
  clearError();
  try {
    const range = encodeURIComponent(`${CONFIG.TAB}!A1:AL`);
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SHEET_ID}/values/${range}`;
    const resp = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
    if (resp.status === 401) { handleAuthExpired(); return; }
    if (!resp.ok) throw new Error(`Sheets API error: ${resp.status}`);

    const { values = [] } = await resp.json();
    let rows = values;
    if (rows.length > 0) {
      const firstRefId = (rows[0][COL.refId] || '').toString();
      if (!firstRefId.startsWith('EVT-')) rows = rows.slice(1);
    }
    inquiries = rows
      .map(row => ({
        refId: row[COL.refId] || '', firstName: row[COL.firstName] || '', lastName: row[COL.lastName] || '',
        eventType: row[COL.eventType] || '', eventTitle: row[COL.eventTitle] || '', eventDate: row[COL.eventDate] || '',
        doorsOpen: row[COL.doorsOpen] || '', doorsClose: row[COL.doorsClose] || '', guestCount: row[COL.guestCount] || '',
        status: row[COL.status] || 'new', quoteTotal: row[COL.quoteTotal] || '', invoiceTotal: row[COL.invoiceTotal] || '',
        calendarEventId: row[COL.calendarEventId] || '', rowIndex: 0, quoteData: safeJson(row[COL.quoteData]), invoiceData: safeJson(row[COL.invoiceData]),
      }))
      .filter(inq => inq.refId && inq.refId.startsWith('EVT-') && inq.eventDate);

    byDate = {};
    inquiries.forEach(inq => { (byDate[inq.eventDate] = byDate[inq.eventDate] || []).push(inq); });

    renderCalendar();
    loadCalendarMonth(viewYear, viewMonth);
  } catch(e) {
    showError('Could not load inquiries: ' + e.message);
  } finally {
    setLoading(false);
  }
}

// ── CALENDAR CROSS-REFERENCE (per visible month, cached) ────────────────
// DST-safe day boundaries -- same approach as index.html's own single-day
// availability check, just scoped to a whole month range in one call.
function isoMidnightNY(dateStr) {
  const naive = new Date(`${dateStr}T00:00:00`);
  const nyc = new Date(naive.toLocaleString('en-US', { timeZone: 'America/New_York' }));
  const offMs = naive.getTime() - nyc.getTime();
  const sign = offMs >= 0 ? '-' : '+';
  const hrs = Math.round(Math.abs(offMs) / 36e5);
  return `${dateStr}T00:00:00${sign}${String(hrs).padStart(2,'0')}:00`;
}
function pad2(n){ return String(n).padStart(2,'0'); }
function monthKey(y,m){ return `${y}-${m}`; }

async function loadCalendarMonth(y, m) {
  const key = monthKey(y, m);
  if (calMonthsFetched[key] || !accessToken) return;
  const firstStr = `${y}-${pad2(m+1)}-01`;
  const nextY = m===11 ? y+1 : y, nextM = m===11 ? 0 : m+1;
  const nextStr = `${nextY}-${pad2(nextM+1)}-01`;
  try {
    const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CAL_ID)}/events`
      + `?timeMin=${encodeURIComponent(isoMidnightNY(firstStr))}&timeMax=${encodeURIComponent(isoMidnightNY(nextStr))}`
      + `&singleEvents=true&orderBy=startTime`;
    const r = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
    if (r.status === 401) { handleAuthExpired(); return; }
    if (!r.ok) return; // best-effort overlay -- a failed fetch just means no off-pipeline flags this month
    const j = await r.json();
    (j.items || []).filter(ev => ev.status !== 'cancelled').forEach(ev => {
      const dateStr = (ev.start.date || ev.start.dateTime || '').slice(0, 10);
      if (!dateStr) return;
      let time = '';
      if (ev.start.dateTime) {
        time = new Date(ev.start.dateTime).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit', timeZone:'America/New_York' });
      }
      (calEventsByDate[dateStr] = calEventsByDate[dateStr] || []).push({
        id: ev.id, title: ev.summary || '(untitled event)', link: ev.htmlLink || '', time,
      });
    });
    calMonthsFetched[key] = true;
    renderCalendar(); // repaint once the overlay data is in
  } catch(e) { /* best-effort */ }
}

// ── MONTH GRID ────────────────────────────────────────────────────────
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const STATUS_ORDER = { new:0, quoted:1, contracted:2, invoiced:3, stale:4, dead:5 };

function shiftMonth(delta) {
  viewMonth += delta;
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  renderCalendar();
  loadCalendarMonth(viewYear, viewMonth);
}
function goToday() {
  const t = new Date();
  viewYear = t.getFullYear(); viewMonth = t.getMonth();
  renderCalendar();
  loadCalendarMonth(viewYear, viewMonth);
}

function renderCalendar() {
  document.getElementById('cal-month-label').textContent = `${MONTH_NAMES[viewMonth]} ${viewYear}`;

  const first = new Date(viewYear, viewMonth, 1);
  const startWeekday = first.getDay(); // 0=Sun
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();
  const todayStr = new Date().toISOString().slice(0,10);

  const cells = [];
  // Leading days from previous month
  for (let i = startWeekday - 1; i >= 0; i--) {
    cells.push({ day: daysInPrevMonth - i, pad: true });
  }
  // This month
  for (let d = 1; d <= daysInMonth; d++) {
    cells.push({ day: d, pad: false, dateStr: `${viewYear}-${pad2(viewMonth+1)}-${pad2(d)}` });
  }
  // Trailing days to fill the last week
  while (cells.length % 7 !== 0) {
    cells.push({ day: cells.length - (startWeekday + daysInMonth) + 1, pad: true });
  }

  const dow = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => `<div class="cal-dow">${d}</div>`).join('');

  const cellsHtml = cells.map(c => {
    if (c.pad) return `<div class="cal-cell pad"><div class="cal-daynum">${c.day}</div></div>`;
    const deals = (byDate[c.dateStr] || []).slice().sort((a,b) => (STATUS_ORDER[a.status]??9) - (STATUS_ORDER[b.status]??9));
    const calEvents = calEventsByDate[c.dateStr] || [];
    // Match by calendarEventId rather than just "any deals exist that day" --
    // that also catches a day that has a tracked deal AND a separate,
    // untracked calendar entry, which the old count-only check missed.
    const trackedIds = new Set(deals.map(d => d.calendarEventId).filter(Boolean));
    const unmatched = calEvents.filter(ev => !trackedIds.has(ev.id));
    const offPipeline = unmatched.length > 0;
    const isToday = c.dateStr === todayStr;
    const shown = deals.slice(0, 2);
    const overflow = deals.length - shown.length;

    const chips = shown.map(inq => {
      const name = [inq.firstName, inq.lastName].filter(Boolean).join(' ') || inq.eventTitle || inq.eventType || 'Untitled';
      const val = fmtMoneyShort(dealValue(inq));
      const time = fmtTimeRange(inq.doorsOpen, inq.doorsClose);
      const guests = inq.guestCount ? inq.guestCount + ' gsts' : '';
      const meta = [val, time, guests].filter(Boolean).join(' · ');
      const tooltip = [name, inq.status, val, time, guests].filter(Boolean).join(' — ');
      return `<div class="cal-chip ${escHtml(inq.status||'new')}" onclick="openDeal('${inq.refId}')" title="${escHtml(tooltip)}">
        <div class="cal-chip-name">${escHtml(name)}</div>
        ${meta ? `<div class="cal-chip-meta">${escHtml(meta)}</div>` : ''}
      </div>`;
    }).join('');
    const moreHtml = overflow > 0 ? `<div class="cal-more">+${overflow} more</div>` : '';
    const flagHtml = offPipeline
      ? `<div class="cal-flag-wrap">
          <div class="cal-flag" title="${unmatched.length} calendar item${unmatched.length>1?'s':''} not on the board — click to view" onclick="toggleCalPopover('${c.dateStr}', event)"></div>
          <div class="cal-popover" id="pop-${c.dateStr}">
            <div class="cal-pop-label">Not on the board</div>
            ${unmatched.map(ev => ev.link
              ? `<a href="${escHtml(ev.link)}" target="_blank" rel="noopener" class="cal-pop-item">
                  <span class="cal-pop-time">${escHtml(ev.time||'All day')}</span>
                  <span class="cal-pop-title">${escHtml(ev.title)}</span>
                </a>`
              : `<div class="cal-pop-item">
                  <span class="cal-pop-time">${escHtml(ev.time||'All day')}</span>
                  <span class="cal-pop-title">${escHtml(ev.title)}</span>
                </div>`).join('')}
          </div>
        </div>`
      : '';

    return `<div class="cal-cell${offPipeline?' off-pipeline':''}${isToday?' today':''}">
      <div class="cal-daynum"><span>${c.day}</span>${flagHtml}</div>
      ${chips}${moreHtml}
    </div>`;
  }).join('');

  document.getElementById('cal-grid').innerHTML = dow + cellsHtml;
}

function openDeal(refId) {
  window.location.href = `index.html?open=${encodeURIComponent(refId)}`;
}
function toggleCalPopover(dateStr, evt) {
  evt.stopPropagation();
  const pop = document.getElementById('pop-' + dateStr);
  if (!pop) return;
  const isOpen = pop.classList.contains('show');
  closeAllCalPopovers();
  if (!isOpen) {
    pop.classList.add('show');
    pop.closest('.cal-cell').classList.add('pop-open');
  }
}
function closeAllCalPopovers() {
  document.querySelectorAll('.cal-popover.show').forEach(p => {
    p.classList.remove('show');
    const cell = p.closest('.cal-cell');
    if (cell) cell.classList.remove('pop-open');
  });
}
document.addEventListener('click', closeAllCalPopovers);
</script>
