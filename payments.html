<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>170 Eldridge — Payments</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0d0a; --card:#161410; --surface-2:#1d1a14; --surface-3:#232019;
  --line:#2b271f; --line-2:#3a352a; --border:var(--line);
  --ink:#f2ede1; --ink2:#d9d2c2; --muted:#9a9080; --muted-2:#6b6353;
  --amber:#eaa23a; --amber-dim:#a87524; --amber-soft:rgba(234,162,58,.12);
  --green:#88b46c; --green-soft:rgba(136,180,108,.14);
  --red:#d3765b; --red-soft:rgba(211,118,91,.14);
  --blue:#7aa0cf; --blue-soft:rgba(122,160,207,.14);
  --violet:#b49bdb; --violet-soft:rgba(180,155,219,.14);
  --display:'Bebas Neue',sans-serif; --mono:'Space Mono',monospace; --body:'Inter',system-ui,sans-serif;
  --new-bg:var(--blue-soft); --new-border:rgba(122,160,207,.35); --new-text:var(--blue);
  --quoted-bg:var(--amber-soft); --quoted-border:var(--amber-dim); --quoted-text:var(--amber);
  --contracted-bg:var(--green-soft); --contracted-border:rgba(136,180,108,.35); --contracted-text:var(--green);
  --invoiced-bg:var(--violet-soft); --invoiced-border:rgba(180,155,219,.35); --invoiced-text:var(--violet);
  --stale:#b08d57; --stale-soft:rgba(176,141,87,.14);
  --stale-bg:var(--stale-soft); --stale-border:rgba(176,141,87,.35); --stale-text:var(--stale);
  --dead-bg:var(--surface-3); --dead-border:var(--line-2); --dead-text:var(--muted-2);
}
html{font-size:15px}
body{font-family:var(--body);background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
::selection{background:var(--amber);color:#0e0d0a}

/* ── AUTH (identical to index.html) ── */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.auth-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:48px 40px;max-width:400px;width:100%;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.45)}
.auth-logo{font-family:var(--display);font-size:1.9rem;letter-spacing:.05em;color:var(--ink);margin-bottom:6px}
.auth-eyebrow{font-family:var(--mono);font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-2);margin-bottom:32px}
.auth-desc{font-size:.875rem;color:var(--muted);line-height:1.65;margin-bottom:32px}
.btn-gsi{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:12px 24px;border-radius:6px;border:1.5px solid var(--line-2);background:#fff;color:#1a1a1a;font-family:var(--body);font-size:.875rem;font-weight:500;cursor:pointer;width:100%;transition:all .15s}
.btn-gsi:hover{opacity:.92;border-color:var(--amber-dim)}
.btn-gsi svg{flex-shrink:0}
.auth-error{margin-top:16px;font-size:.8rem;color:var(--red);background:var(--red-soft);border:1px solid rgba(211,118,91,.35);border-radius:5px;padding:8px 12px;display:none}
.gate-input{width:100%;background:var(--surface-3);border:1px solid var(--line-2);border-radius:6px;padding:12px 14px;font-size:.9rem;color:var(--ink);font-family:inherit;text-align:center;letter-spacing:.1em;transition:.14s}
.gate-input:focus{outline:none;border-color:var(--amber-dim)}
.gate-btn{width:100%;margin-top:14px;background:var(--amber);border:none;border-radius:6px;padding:12px;font-family:var(--body);font-size:.875rem;font-weight:600;color:#140f08;cursor:pointer;transition:.15s}
.gate-btn:hover{background:#f4b04c}

/* ── SHELL ── */
.site-header{background:rgba(14,13,10,.94);backdrop-filter:blur(10px);height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--line)}
.logo{font-family:var(--display);font-size:1.4rem;color:var(--ink);letter-spacing:.05em}
.header-right{display:flex;align-items:center;gap:14px}
.header-tag{font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2)}
.user-chip{font-family:var(--mono);font-size:.65rem;color:var(--muted-2);letter-spacing:.04em}
.header-btn{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:7px 13px;border-radius:5px;border:1px solid var(--line-2);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s}
.header-btn:hover{background:var(--amber-soft);border-color:var(--amber-dim);color:var(--ink)}
.hub-nav{display:flex;gap:4px;padding:10px 32px;background:var(--surface-2);border-bottom:1px solid var(--line);position:sticky;top:60px;z-index:99}
.hub-nav-link{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:7px 14px;border-radius:5px;transition:.15s}
.hub-nav-link:hover{color:var(--ink);background:var(--surface-3)}
.hub-nav-link.active{color:var(--amber);background:var(--amber-soft)}
.page{max-width:1080px;margin:0 auto;padding:32px 24px 80px}

.loading-wrap{display:flex;align-items:center;gap:10px;color:var(--muted);font-family:var(--mono);font-size:.8rem;padding:40px 0;justify-content:center}
.spin{width:14px;height:14px;border:2px solid var(--line-2);border-top-color:var(--amber);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-banner{background:var(--red-soft);border:1px solid rgba(211,118,91,.35);color:var(--red);padding:12px 16px;border-radius:6px;font-size:.85rem;margin-bottom:20px}

/* ── STATS ── */
.pay-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
.stat-label{font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);margin-bottom:6px}
.stat-value{font-family:var(--display);font-size:1.7rem;letter-spacing:.02em}
.stat-value.outstanding{color:var(--red)}
.stat-value.collected{color:var(--green)}
.stat-value.overdue{color:var(--amber)}

/* ── FILTERS ── */
.pay-filters{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.search-inp{flex:1;min-width:200px;background:var(--surface-3);border:1px solid var(--line-2);border-radius:7px;padding:11px 14px;font-size:.88rem;color:var(--ink);font-family:var(--body);outline:none;transition:border-color .15s}
.search-inp:focus{border-color:var(--amber-dim)}
.filter-pill{font-family:var(--mono);font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;padding:8px 13px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface-3);color:var(--muted);cursor:pointer;transition:.14s;white-space:nowrap}
.filter-pill:hover{border-color:var(--amber-dim);color:var(--ink)}
.filter-pill.active{background:var(--amber-soft);border-color:var(--amber-dim);color:var(--amber)}

/* ── INVOICE CARDS ── */
.invoice-card{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:14px;overflow:hidden}
.invoice-card.overdue{border-color:rgba(211,118,91,.4)}
.invoice-head{padding:16px 20px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.invoice-name{font-family:var(--display);font-size:1.2rem;letter-spacing:.02em;color:var(--ink)}
.invoice-meta{font-family:var(--mono);font-size:.68rem;color:var(--muted-2);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.status-badge{font-family:var(--mono);font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px}
.status-badge.new{background:var(--new-bg);color:var(--new-text)}
.status-badge.quoted{background:var(--quoted-bg);color:var(--quoted-text)}
.status-badge.contracted{background:var(--contracted-bg);color:var(--contracted-text)}
.status-badge.invoiced{background:var(--invoiced-bg);color:var(--invoiced-text)}
.status-badge.stale{background:var(--stale-bg);color:var(--stale-text)}
.status-badge.dead{background:var(--dead-bg);color:var(--dead-text)}
.invoice-totals{display:flex;gap:24px;padding:14px 20px;background:var(--surface-2);flex-wrap:wrap}
.itot{font-family:var(--mono)}
.itot-label{font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2)}
.itot-value{font-size:1rem;margin-top:2px}
.itot-value.balance-due{color:var(--red)}
.itot-value.balance-paid{color:var(--green)}
.overdue-tag{font-family:var(--mono);font-size:.6rem;letter-spacing:.05em;text-transform:uppercase;color:var(--red);background:var(--red-soft);border:1px solid rgba(211,118,91,.35);padding:3px 8px;border-radius:99px;margin-left:auto;align-self:center}
.invoice-body{padding:14px 20px}
.pay-row{display:grid;grid-template-columns:1fr 100px auto auto;gap:8px;align-items:center;padding:6px 0}
.pay-row .inp{background:var(--surface-3);border:1px solid var(--line-2);border-radius:5px;padding:7px 9px;font-size:.82rem;color:var(--ink);font-family:var(--body);outline:none;transition:border-color .15s}
.pay-row .inp:focus{border-color:var(--amber-dim)}
.paytag{font-family:var(--mono);font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:99px;cursor:pointer;user-select:none;text-align:center;white-space:nowrap}
.paytag.paid{background:var(--green-soft);color:var(--green);border:1px solid var(--green)}
.paytag.due{background:var(--red-soft);color:var(--red);border:1px solid var(--red)}
.pay-xbtn{background:none;border:none;color:var(--muted-2);font-size:15px;line-height:1;padding:4px 6px;cursor:pointer;transition:.14s}
.pay-xbtn:hover{color:var(--red)}
.pay-add{display:flex;gap:8px;margin-top:10px;align-items:center}
.pay-add .inp{background:var(--surface-3);border:1px dashed var(--line-2);border-radius:5px;padding:8px 10px;font-size:.82rem;color:var(--ink);font-family:var(--body);outline:none}
.pay-addbtn{font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;padding:8px 13px;border-radius:5px;border:1px dashed var(--amber-dim);background:var(--amber-soft);color:var(--amber);cursor:pointer;white-space:nowrap;transition:.14s}
.pay-addbtn:hover{background:rgba(234,162,58,.2)}
.invoice-foot{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-top:1px solid var(--line)}
.inv-save-status{font-family:var(--mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2)}
.inv-save-status.saving{color:var(--muted)}
.inv-save-status.saved{color:var(--green)}
.inv-save-status.err{color:var(--red)}
.deal-btn{font-family:var(--mono);font-size:.66rem;letter-spacing:.05em;text-transform:uppercase;padding:8px 14px;border-radius:5px;border:1px solid var(--amber-dim);background:var(--amber-soft);color:var(--amber);cursor:pointer;transition:.14s}
.deal-btn:hover{background:rgba(234,162,58,.2)}

.empty{text-align:center;padding:60px 20px;color:var(--muted-2);font-family:var(--mono);font-size:.8rem}

@media(max-width:900px){.pay-stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.site-header{padding:0 16px}.hub-nav{padding:8px 16px}.header-tag,.user-chip{display:none}.page{padding:20px 16px 60px}.pay-row{grid-template-columns:1fr 80px auto auto}}
</style>
</head>
<body>

<div id="gate-screen" class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">CARRIAGE HOUSE</div>
    <div class="auth-eyebrow">Event Hub</div>
    <div class="auth-desc">Enter the access code to continue.</div>
    <input type="password" class="gate-input" id="gate-input" placeholder="Access code" autocomplete="off" onkeydown="if(event.key==='Enter') checkGate()">
    <button class="gate-btn" id="gate-btn" onclick="checkGate()">Continue</button>
    <div class="auth-error" id="gate-error">Incorrect code. Try again.</div>
  </div>
</div>

<div id="auth-screen" class="auth-wrap" style="display:none">
  <div class="auth-card">
    <div class="auth-logo">CARRIAGE HOUSE</div>
    <div class="auth-eyebrow">Event Hub</div>
    <div class="auth-desc">Sign in with your Google account to manage payments.</div>
    <button class="btn-gsi" id="signin-btn" onclick="signIn()">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z"/></svg>
      Sign in with Google
    </button>
    <div class="auth-error" id="auth-error"></div>
  </div>
</div>

<div id="app" style="display:none">
  <header class="site-header">
    <div class="logo">CARRIAGE HOUSE</div>
    <div class="header-right">
      <span class="header-tag">Event Hub</span>
      <span class="user-chip" id="user-chip"></span>
      <button class="header-btn" onclick="signOut()">Sign out</button>
    </div>
  </header>

  <nav class="hub-nav">
    <a href="index.html" class="hub-nav-link">Board</a>
    <a href="calendar.html" class="hub-nav-link">Calendar</a>
    <a href="clients.html" class="hub-nav-link">Clients</a>
    <a href="payments.html" class="hub-nav-link active">Payments</a>
  </nav>

  <div class="page">
    <div class="pay-stats">
      <div class="stat-card"><div class="stat-label">Total Invoiced</div><div class="stat-value" id="stat-invoiced">$0</div></div>
      <div class="stat-card"><div class="stat-label">Collected</div><div class="stat-value collected" id="stat-collected">$0</div></div>
      <div class="stat-card"><div class="stat-label">Outstanding</div><div class="stat-value outstanding" id="stat-outstanding">$0</div></div>
      <div class="stat-card"><div class="stat-label">Overdue Installments</div><div class="stat-value overdue" id="stat-overdue">0</div></div>
    </div>

    <div class="pay-filters">
      <input class="search-inp" id="search-inp" placeholder="Search by client or event…" oninput="renderInvoices()">
      <button class="filter-pill active" id="filter-all" onclick="setFilter('all')">All</button>
      <button class="filter-pill" id="filter-outstanding" onclick="setFilter('outstanding')">Outstanding</button>
      <button class="filter-pill" id="filter-paid" onclick="setFilter('paid')">Paid</button>
      <button class="filter-pill" id="filter-overdue" onclick="setFilter('overdue')">Overdue</button>
    </div>

    <div id="loading-row" class="loading-wrap" style="display:none"><div class="spin"></div> Loading…</div>
    <div id="error-row" class="error-banner" style="display:none"></div>
    <div id="invoice-list"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════
// CONFIG -- must match index.html exactly (same Sheet, same columns).
const CONFIG = {
  CLIENT_ID: '515515941640-qvbv3p5mm8j5rt0mkqilgu8sfo2cplmu.apps.googleusercontent.com',
  SHEET_ID:  '10z_FdC74leDuRG8-CR7U4IFzWOM4-1wNueM9D3Dmn3Q',
  TAB:       'Inquiries',
};
const COL = {
  timestamp:0, refId:1, firstName:2, lastName:3, email:4, phone:5,
  company:6, referral:7, eventType:8, eventDate:9, doorsOpen:10,
  doorsClose:11, guestCount:12, doorStaff:13, rooftop:14,
  servicesNeeded:15, outsideVendors:16, guestMethod:17, publicEvent:18,
  alcohol:19, ageReq:20, insurance:21, budget:22, payMethod:23, notes:24,
  status:25, quoteTotal:26, quoteData:27, contractGenerated:28, lastUpdatedBy:29, calendarEventId:30,
  invoiceData:31, invoiceTotal:32, starred:33, followupDate:34,
  lastActivityAt:35, lastAutoDraftAt:36, eventTitle:37,
  quotedBy:42, contractedBy:43, invoicedBy:44,
};

let tokenClient, accessToken = null, currentUserEmail = '';
let inquiries = [];
let activeFilter = 'all';

// ── ACCESS GATE (identical to index.html) ──────────────────────────────
const GATE_CODE = '1070';
const GATE_KEY  = '170e_gate_ok';
function checkGate(){
  const input = document.getElementById('gate-input');
  const err   = document.getElementById('gate-error');
  if (input.value === GATE_CODE) {
    localStorage.setItem(GATE_KEY, '1');
    err.style.display = 'none';
    document.getElementById('gate-screen').style.display = 'none';
    document.getElementById('auth-screen').style.display = 'flex';
  } else {
    err.style.display = 'block';
    input.value = '';
    input.focus();
  }
}

// ── INIT ──────────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  if (localStorage.getItem(GATE_KEY) === '1') {
    document.getElementById('gate-screen').style.display = 'none';
    document.getElementById('auth-screen').style.display = 'flex';
  }
  const saved = sessionStorage.getItem('170e_token');
  if (saved) {
    accessToken = saved;
    currentUserEmail = sessionStorage.getItem('170e_user') || '';
    if (currentUserEmail) document.getElementById('user-chip').textContent = currentUserEmail;
    showApp();
    loadInquiries();
  }
  const t = setInterval(() => {
    if (window.google?.accounts?.oauth2) {
      clearInterval(t);
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CONFIG.CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/gmail.compose',
        callback: onToken,
      });
    }
  }, 100);
});

function signIn() {
  if (!tokenClient) { showAuthError('Google Sign-In is still loading — please try again in a moment.'); return; }
  tokenClient.requestAccessToken({ prompt: '' });
}
function onToken(resp) {
  if (resp.error) { showAuthError('Sign-in failed: ' + resp.error); return; }
  accessToken = resp.access_token;
  sessionStorage.setItem('170e_token', accessToken);
  fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers:{ Authorization:`Bearer ${accessToken}` } })
    .then(r=>r.json()).then(info=>{
      currentUserEmail = info.email || '';
      sessionStorage.setItem('170e_user', currentUserEmail);
      document.getElementById('user-chip').textContent = currentUserEmail;
    }).catch(()=>{});
  showApp();
  loadInquiries();
}
function signOut() {
  if (accessToken && window.google?.accounts?.oauth2) google.accounts.oauth2.revoke(accessToken);
  sessionStorage.clear();
  accessToken = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
}
function showApp() {
  document.getElementById('gate-screen').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}
function showAuthError(msg) {
  const el = document.getElementById('auth-error');
  el.textContent = msg; el.style.display = 'block';
}
function handleAuthExpired() {
  accessToken = null;
  sessionStorage.removeItem('170e_token');
  setLoading(false);
  showError('Your session expired. Please sign in again.');
  document.getElementById('app').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
}
function setLoading(show) { document.getElementById('loading-row').style.display = show ? 'flex' : 'none'; }
function showError(msg) { const el=document.getElementById('error-row'); el.textContent=msg; el.style.display='block'; }
function clearError() { document.getElementById('error-row').style.display = 'none'; }

// ── LOAD ─────────────────────────────────────────────────────────────
function safeJson(str) { if (!str) return null; try { return JSON.parse(str); } catch { return null; } }
function escHtml(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDateShort(s) {
  if (!s) return '—';
  return new Date(s + 'T12:00:00').toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}

// Same shape as index.html's parseRow -- writeRow() below needs the full
// row so it can preserve every hub-managed field except the two this page
// actually changes (invoiceData, invoiceTotal).
function parseRow(row, rowIndex) {
  return {
    rowIndex,
    timestamp: row[COL.timestamp] || '', refId: row[COL.refId] || '',
    firstName: row[COL.firstName] || '', lastName: row[COL.lastName] || '',
    email: row[COL.email] || '', phone: row[COL.phone] || '', company: row[COL.company] || '',
    eventType: row[COL.eventType] || '', eventDate: row[COL.eventDate] || '',
    status: row[COL.status] || 'new', quoteTotal: row[COL.quoteTotal] || '', quoteData: safeJson(row[COL.quoteData]),
    contractGenerated: row[COL.contractGenerated] || '', lastUpdatedBy: row[COL.lastUpdatedBy] || '',
    calendarEventId: row[COL.calendarEventId] || '', invoiceData: safeJson(row[COL.invoiceData]),
    invoiceTotal: row[COL.invoiceTotal] || '',
    starred: row[COL.starred] === 'true' ? true : row[COL.starred] === 'false' ? false : undefined,
    followupDate: row[COL.followupDate] || '', lastAutoDraftAt: row[COL.lastAutoDraftAt] || '',
    eventTitle: row[COL.eventTitle] || '',
    quotedBy: row[COL.quotedBy] || '', contractedBy: row[COL.contractedBy] || '', invoicedBy: row[COL.invoicedBy] || '',
  };
}

async function loadInquiries() {
  setLoading(true);
  clearError();
  try {
    const range = encodeURIComponent(`${CONFIG.TAB}!A1:AS`);
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SHEET_ID}/values/${range}`;
    const resp = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
    if (resp.status === 401) { handleAuthExpired(); return; }
    if (!resp.ok) throw new Error(`Sheets API error: ${resp.status}`);

    const { values = [] } = await resp.json();
    let rows = values;
    if (rows.length > 0) {
      const firstRefId = (rows[0][COL.refId] || '').toString();
      if (!firstRefId.startsWith('EVT-')) rows = rows.slice(1);
    }
    const offset = values.length - rows.length + 1;
    inquiries = rows.map((row,i) => parseRow(row, i+offset))
      .filter(inq => inq.refId && inq.refId.startsWith('EVT-'))
      .filter(inq => inq.invoiceData && Array.isArray(inq.invoiceData.items) && inq.invoiceData.items.length > 0);

    renderInvoices();
  } catch(e) {
    showError('Could not load invoices: ' + e.message);
  } finally {
    setLoading(false);
  }
}

// Writes the Z:AK hub-managed range, same as index.html's writeRow(), just
// serialized straight from the in-memory inq object rather than a separate
// pick/override step -- this page only ever mutates invoiceData/invoiceTotal
// on inq directly before calling this, so inq itself is already correct.
async function writeRow(inq) {
  const values = [
    inq.status || '', inq.quoteTotal || '', inq.quoteData ? JSON.stringify(inq.quoteData) : '',
    inq.contractGenerated || '', inq.lastUpdatedBy || currentUserEmail || '', inq.calendarEventId || '',
    inq.invoiceData ? JSON.stringify(inq.invoiceData) : '', inq.invoiceTotal || '',
    inq.starred === true ? 'true' : inq.starred === false ? 'false' : '', inq.followupDate || '',
    new Date().toISOString(), inq.lastAutoDraftAt || '',
  ];
  const range = encodeURIComponent(`${CONFIG.TAB}!Z${inq.rowIndex}:AK${inq.rowIndex}`);
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SHEET_ID}/values/${range}?valueInputOption=RAW`;
  const resp = await fetch(url, { method:'PUT', headers:{ Authorization:`Bearer ${accessToken}`, 'Content-Type':'application/json' }, body: JSON.stringify({ values:[values] }) });
  if (resp.status === 401) { handleAuthExpired(); return false; }
  return resp.ok;
}

// ── INVOICE MATH ─────────────────────────────────────────────────────
function invoiceTotals(inv) {
  const items = (inv.items||[]).reduce((a,i) => a + (parseFloat(i.amount)||0), 0);
  const paid  = (inv.payments||[]).filter(p=>p.paid).reduce((a,p) => a + (parseFloat(p.amount)||0), 0);
  return { items: Math.round(items), paid: Math.round(paid), balance: Math.round(items-paid) };
}
const TODAY_STR = new Date().toISOString().slice(0,10);
function isOverdue(inq) {
  // An installment counts as overdue once its event date has passed and it's
  // still marked due -- that's the point at which chasing it becomes urgent.
  if (!inq.eventDate || inq.eventDate >= TODAY_STR) return false;
  return (inq.invoiceData.payments||[]).some(p => !p.paid);
}
function overdueCount(inq) {
  if (!inq.eventDate || inq.eventDate >= TODAY_STR) return 0;
  return (inq.invoiceData.payments||[]).filter(p => !p.paid).length;
}

// ── RENDER ────────────────────────────────────────────────────────────
function setFilter(f) {
  activeFilter = f;
  ['all','outstanding','paid','overdue'].forEach(k => document.getElementById('filter-'+k).classList.toggle('active', k===f));
  renderInvoices();
}

function renderInvoices() {
  const q = (document.getElementById('search-inp').value || '').trim().toLowerCase();

  // Stats always reflect ALL invoices on file, regardless of the active filter/search.
  let totalInvoiced=0, totalCollected=0, totalOutstanding=0, overdueInstallments=0;
  inquiries.forEach(inq => {
    const t = invoiceTotals(inq.invoiceData);
    totalInvoiced += t.items; totalCollected += t.paid; totalOutstanding += Math.max(0,t.balance);
    overdueInstallments += overdueCount(inq);
  });
  document.getElementById('stat-invoiced').textContent = '$'+totalInvoiced.toLocaleString();
  document.getElementById('stat-collected').textContent = '$'+totalCollected.toLocaleString();
  document.getElementById('stat-outstanding').textContent = '$'+totalOutstanding.toLocaleString();
  document.getElementById('stat-overdue').textContent = overdueInstallments;

  let list = inquiries.slice();
  if (q) {
    list = list.filter(inq => {
      const blob = [inq.firstName, inq.lastName, inq.company, inq.eventTitle, inq.eventType, inq.refId].join(' ').toLowerCase();
      return blob.includes(q);
    });
  }
  list = list.filter(inq => {
    const t = invoiceTotals(inq.invoiceData);
    if (activeFilter === 'outstanding') return t.balance > 0;
    if (activeFilter === 'paid') return t.balance <= 0;
    if (activeFilter === 'overdue') return isOverdue(inq);
    return true;
  });
  // Biggest outstanding balance first -- that's what needs attention; fully
  // paid invoices naturally sink to the bottom since their balance is 0.
  list.sort((a,b) => invoiceTotals(b.invoiceData).balance - invoiceTotals(a.invoiceData).balance);

  if (!list.length) {
    document.getElementById('invoice-list').innerHTML = `<div class="empty">No invoices found.</div>`;
    return;
  }
  document.getElementById('invoice-list').innerHTML = list.map(inq => invoiceCardHtml(inq)).join('');
}

function invoiceCardHtml(inq) {
  const inv = inq.invoiceData;
  const t = invoiceTotals(inv);
  const overdue = isOverdue(inq);
  const name = [inq.firstName, inq.lastName].filter(Boolean).join(' ') || '(no name)';
  const title = inq.eventTitle || inq.eventType || 'Untitled event';

  const payRows = (inv.payments||[]).map((p,i) => `
    <div class="pay-row">
      <input class="inp" value="${escHtml(p.label)}" oninput="payEdit('${inq.refId}',${i},'label',this.value)">
      <input class="inp" value="${p.amount}" oninput="payEdit('${inq.refId}',${i},'amount',this.value)">
      <span class="paytag ${p.paid?'paid':'due'}" onclick="payToggle('${inq.refId}',${i})">${p.paid?'● paid':'○ due'}</span>
      <button class="pay-xbtn" title="Remove" onclick="payDel('${inq.refId}',${i})">✕</button>
    </div>`).join('');

  return `<div class="invoice-card${overdue?' overdue':''}" id="card-${inq.refId}">
    <div class="invoice-head">
      <div>
        <div class="invoice-name">${escHtml(name)}</div>
        <div class="invoice-meta">
          <span>${escHtml(title)}</span>
          <span>${fmtDateShort(inq.eventDate)}</span>
          <span>${escHtml(inv.number||inq.refId)}</span>
          <span class="status-badge ${escHtml(inq.status||'new')}">${escHtml(inq.status||'new')}</span>
          ${inq.invoicedBy ? `<span title="Invoiced by">Invoiced by ${escHtml(inq.invoicedBy)}</span>` : ''}
        </div>
      </div>
      ${overdue ? `<span class="overdue-tag">Overdue</span>` : ''}
    </div>
    <div class="invoice-totals">
      <div class="itot"><div class="itot-label">Total</div><div class="itot-value">$${t.items.toLocaleString()}</div></div>
      <div class="itot"><div class="itot-label">Collected</div><div class="itot-value">$${t.paid.toLocaleString()}</div></div>
      <div class="itot"><div class="itot-label">Balance</div><div class="itot-value ${t.balance>0?'balance-due':'balance-paid'}">$${t.balance.toLocaleString()}</div></div>
    </div>
    <div class="invoice-body">
      ${payRows}
      <div class="pay-add">
        <input class="inp" id="newlabel-${inq.refId}" placeholder="Payment label (e.g. Deposit)">
        <input class="inp" id="newamount-${inq.refId}" placeholder="Amount" style="max-width:110px">
        <button class="pay-addbtn" onclick="payAdd('${inq.refId}')">+ Log payment</button>
      </div>
    </div>
    <div class="invoice-foot">
      <span class="inv-save-status" id="save-${inq.refId}"></span>
      <button class="deal-btn" onclick="openInvoice('${inq.refId}')">Open invoice →</button>
    </div>
  </div>`;
}

// ── EDIT / SAVE ──────────────────────────────────────────────────────
function findInq(refId) { return inquiries.find(i => i.refId === refId); }
function saveStatus(refId, state) {
  const el = document.getElementById('save-'+refId); if (!el) return;
  el.className = 'inv-save-status' + (state?' '+state:'');
  el.textContent = state==='saving'?'Saving…' : state==='saved'?'Saved' : state==='err'?'Not saved' : '';
  if (state==='saved') setTimeout(() => { if (el.textContent==='Saved') { el.textContent=''; el.className='inv-save-status'; } }, 1500);
}
async function persist(inq) {
  saveStatus(inq.refId, 'saving');
  const ok = await writeRow(inq);
  saveStatus(inq.refId, ok ? 'saved' : 'err');
}
function refreshCard(inq) {
  const el = document.getElementById('card-'+inq.refId);
  if (el) el.outerHTML = invoiceCardHtml(inq);
  // Stats in the header should reflect the edit immediately too.
  renderStatsOnly();
}
function renderStatsOnly() {
  let totalInvoiced=0, totalCollected=0, totalOutstanding=0, overdueInstallments=0;
  inquiries.forEach(inq => {
    const t = invoiceTotals(inq.invoiceData);
    totalInvoiced += t.items; totalCollected += t.paid; totalOutstanding += Math.max(0,t.balance);
    overdueInstallments += overdueCount(inq);
  });
  document.getElementById('stat-invoiced').textContent = '$'+totalInvoiced.toLocaleString();
  document.getElementById('stat-collected').textContent = '$'+totalCollected.toLocaleString();
  document.getElementById('stat-outstanding').textContent = '$'+totalOutstanding.toLocaleString();
  document.getElementById('stat-overdue').textContent = overdueInstallments;
}

function payToggle(refId, i) {
  const inq = findInq(refId); if (!inq) return;
  inq.invoiceData.payments[i].paid = !inq.invoiceData.payments[i].paid;
  inq.invoiceTotal = invoiceTotals(inq.invoiceData).items;
  refreshCard(inq);
  persist(inq);
}
function payEdit(refId, i, key, val) {
  const inq = findInq(refId); if (!inq) return;
  inq.invoiceData.payments[i][key] = key==='amount' ? (parseFloat(val)||0) : val;
  // Don't refreshCard() here -- it would rebuild the input mid-keystroke and
  // steal focus. Totals catch up on blur via the debounced save below.
  clearTimeout(inq._saveTimer);
  inq._saveTimer = setTimeout(() => { refreshCard(inq); persist(inq); }, 700);
}
function payDel(refId, i) {
  const inq = findInq(refId); if (!inq) return;
  inq.invoiceData.payments.splice(i,1);
  inq.invoiceTotal = invoiceTotals(inq.invoiceData).items;
  refreshCard(inq);
  persist(inq);
}
function payAdd(refId) {
  const inq = findInq(refId); if (!inq) return;
  const labelEl = document.getElementById('newlabel-'+refId), amountEl = document.getElementById('newamount-'+refId);
  const label = (labelEl.value||'').trim();
  const amount = parseFloat(amountEl.value);
  if (!label) { labelEl.focus(); return; }
  if (isNaN(amount) || amount <= 0) { amountEl.focus(); return; }
  inq.invoiceData.payments.push({ id:'pm'+Date.now(), label, amount, paid:false });
  inq.invoiceTotal = invoiceTotals(inq.invoiceData).items;
  refreshCard(inq);
  persist(inq);
}

// ── JUMP TO PORTAL: INVOICE STAGE ───────────────────────────────────────
function openInvoice(refId) {
  const inq = findInq(refId);
  if (!inq) return;
  sessionStorage.setItem('170e_prefill', JSON.stringify({
    source: 'hub',
    stage: 'invoice',
    refId: inq.refId,
    rowIndex: inq.rowIndex,
    inquiry: inq,
    quote: inq.quoteData || null,
    invoice: inq.invoiceData || null,
    token: accessToken,
    calendarEventId: inq.calendarEventId || '',
    portalState: null,
  }));
  if (accessToken) sessionStorage.setItem('170e_token', accessToken);
  if (currentUserEmail) sessionStorage.setItem('170e_user', currentUserEmail);
  window.location.href = 'portal.html';
}
</script>
