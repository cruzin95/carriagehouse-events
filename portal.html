<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carriage House — Booking Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0d0a; --surface:#161410; --surface-2:#1d1a14; --surface-3:#232019;
  --line:#2b271f; --line-2:#3a352a;
  --ink:#f2ede1; --muted:#9a9080; --muted-2:#6b6353;
  --amber:#eaa23a; --amber-dim:#a87524; --amber-soft:rgba(234,162,58,.12);
  --green:#88b46c; --green-soft:rgba(136,180,108,.14);
  --red:#d3765b; --red-soft:rgba(211,118,91,.14);
  --blue:#7aa0cf;
  --display:'Bebas Neue',sans-serif;
  --mono:'Space Mono',monospace;
  --body:'Inter',system-ui,sans-serif;
  --radius:7px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:400}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:var(--body);color:var(--ink)}
a{color:var(--amber)}
::selection{background:var(--amber);color:#0e0d0a}

/* ---- top bar ---- */
.topbar{position:sticky;top:0;z-index:40;background:rgba(14,13,10,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1320px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand .mark{font-family:var(--display);font-size:26px;letter-spacing:.06em;color:var(--ink);line-height:1}
.brand .sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.24em;color:var(--muted-2);text-transform:uppercase}
.ref-chip{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber-dim);border-radius:100px;padding:4px 11px;white-space:nowrap}
.topbar-spacer{flex:1}
.iobar{display:flex;gap:7px;flex-wrap:wrap}
.io-btn{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:transparent;border:1px solid var(--line-2);border-radius:5px;padding:7px 11px;transition:.14s}
.io-btn:hover{color:var(--ink);border-color:var(--muted)}
.io-btn.danger:hover{color:var(--red);border-color:var(--red)}

/* ---- stage nav ---- */
.stagenav{max-width:1320px;margin:0 auto;padding:0 22px;display:flex;gap:0;border-bottom:1px solid var(--line)}
.stage-tab{position:relative;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2);background:none;border:none;padding:16px 20px 14px;transition:.14s;display:flex;align-items:center;gap:9px}
.stage-tab .idx{font-size:10px;color:var(--amber-dim)}
.stage-tab:hover{color:var(--muted)}
.stage-tab.active{color:var(--ink)}
.stage-tab.active::after{content:"";position:absolute;left:20px;right:20px;bottom:-1px;height:2px;background:var(--amber)}
.stage-tab .flow{color:var(--muted-2);margin:0 2px}

/* ---- layout ---- */
.stage{display:none;max-width:1320px;margin:0 auto;padding:26px 22px 90px}
.stage.active{display:block}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:26px;align-items:start}
@media(max-width:1000px){.split{grid-template-columns:1fr}}

/* ---- panels ---- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px;overflow:hidden}
.panel-head{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.panel-head .slash{font-family:var(--mono);color:var(--amber);font-size:12px}
.panel-head h3{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
.panel-head .ph-right{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
.panel-body{padding:14px 15px}

/* ---- form fields ---- */
.field{margin-bottom:12px}
.field:last-child{margin-bottom:0}
.field label,.flabel{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.inp,select.inp,textarea.inp{width:100%;background:var(--surface-3);border:1px solid var(--line-2);border-radius:5px;padding:8px 10px;font-size:13px;color:var(--ink);transition:.14s}
.inp:focus{outline:none;border-color:var(--amber-dim);background:#26221a}
textarea.inp{resize:vertical;min-height:60px;line-height:1.55}
select.inp{appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%239a9080' stroke-width='1.3'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 11px center;padding-right:28px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.hint{font-family:var(--mono);font-size:10px;color:var(--muted-2);margin-top:4px;letter-spacing:.02em}

/* prefix input (money) */
.money{position:relative}
.money::before{content:"$";position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted-2);font-family:var(--mono);font-size:12px}
.money .inp{padding-left:20px}

/* ---- toggle rows (production items) ---- */
.togrow{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}
.togrow:last-child{border-bottom:none}
.sw{position:relative;width:34px;height:19px;flex:none;background:var(--surface-3);border:1px solid var(--line-2);border-radius:100px;transition:.16s;cursor:pointer}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--muted);transition:.16s}
.sw.on{background:var(--amber-soft);border-color:var(--amber-dim)}
.sw.on::after{transform:translateX(15px);background:var(--amber)}
.togrow .tl{flex:1;font-size:13px}
.togrow .tl small{display:block;font-family:var(--mono);font-size:10px;color:var(--muted-2);letter-spacing:.04em}
.togrow.off .tl{color:var(--muted-2)}
.mini-money{width:88px;flex:none}

/* staff role rows */
.role{display:grid;grid-template-columns:1fr 62px 52px;gap:8px;align-items:end;padding:8px 0;border-bottom:1px solid var(--line)}
.role:last-child{border-bottom:none}
.role .rname{font-size:13px}
.role .rname small{display:block;font-family:var(--mono);font-size:10px;color:var(--muted-2)}
.role .inp{padding:6px 7px;font-size:12px;text-align:center}
.role .rlabel{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);margin-bottom:3px;text-align:center}

/* small add/remove */
.addbtn{width:100%;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);background:var(--amber-soft);border:1px dashed var(--amber-dim);border-radius:5px;padding:9px;margin-top:10px;transition:.14s}
.addbtn:hover{background:rgba(234,162,58,.18)}
.xbtn{background:none;border:none;color:var(--muted-2);font-size:15px;line-height:1;padding:2px 5px;transition:.14s}
.xbtn:hover{color:var(--red)}

/* ---- the document / summary side ---- */
.doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);position:sticky;top:96px}
.doc-head{padding:16px 18px 13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.doc-head .dt{font-family:var(--display);font-size:23px;letter-spacing:.05em;line-height:1}
.doc-head .dmeta{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em;text-align:right;line-height:1.7}
.doc-body{padding:6px 18px 16px;max-height:none}

/* line items with dotted leaders */
.grp{margin-top:16px}
.grp-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.grp-h .s{font-family:var(--mono);color:var(--amber);font-size:11px}
.grp-h .t{font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.grp-h .sub{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink)}
.li{display:flex;align-items:baseline;gap:6px;padding:4px 0;font-size:12.5px}
.li .ln{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%}
.li .ln small{color:var(--muted-2);font-family:var(--mono);font-size:10px}
.li .lead{flex:1;border-bottom:1px dotted var(--line-2);transform:translateY(-3px);min-width:14px}
.li .lp{font-family:var(--mono);font-size:12px;color:var(--ink);white-space:nowrap;display:flex;align-items:center;gap:6px}
.li .pedit{width:74px;background:transparent;border:none;border-bottom:1px solid transparent;text-align:right;font-family:var(--mono);font-size:12px;color:var(--ink);padding:1px 2px}
.li .pedit:hover{border-bottom-color:var(--line-2)}
.li .pedit:focus{outline:none;border-bottom-color:var(--amber);color:var(--amber)}
.li.ovr .pedit{color:var(--amber)}
.li .ovrdot{width:5px;height:5px;border-radius:50%;background:var(--amber);flex:none;opacity:0}
.li.ovr .ovrdot{opacity:1}
.li .rst{background:none;border:none;color:var(--muted-2);font-size:11px;padding:0 2px;opacity:0;transition:.12s}
.li.ovr .rst{opacity:1}
.li .rst:hover{color:var(--amber)}
.li.muted .ln{color:var(--muted-2)}

/* totals */
.totals{margin-top:18px;padding-top:14px;border-top:1px solid var(--line-2)}
.tl-line{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.tl-line .k{color:var(--muted)}
.tl-line .v{font-family:var(--mono);color:var(--ink)}
.tl-line.disc .v{color:var(--green)}
.tl-line.add .v{color:var(--red)}
.tl-line.grand{margin-top:8px;padding-top:10px;border-top:1px solid var(--line-2)}
.tl-line.grand .k{font-family:var(--display);font-size:19px;letter-spacing:.04em;color:var(--ink)}
.tl-line.grand .v{font-size:18px;color:var(--amber)}
.tl-line.sponsor .k,.tl-line.sponsor .v{color:var(--green)}
.tl-note{font-family:var(--mono);font-size:9.5px;color:var(--muted-2);letter-spacing:.03em;margin-top:3px}

/* deposit schedule mini */
.sched{margin-top:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:11px 13px}
.sched-h{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.sched-r{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0;font-size:12px}
.sched-r .sk{color:var(--muted)}
.sched-r .sk b{color:var(--ink);font-weight:500}
.sched-r .sv{font-family:var(--mono);color:var(--ink)}

/* action row */
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.act{flex:1;min-width:130px;font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;padding:11px 12px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);transition:.14s;display:flex;align-items:center;justify-content:center;gap:7px}
.act:hover{border-color:var(--muted)}
.act.primary{background:var(--amber);border-color:var(--amber);color:#120f08;font-weight:700}
.act.primary:hover{background:#f4b04c}
.act.flow{background:var(--amber-soft);border-color:var(--amber-dim);color:var(--amber)}
.act.flow:hover{background:rgba(234,162,58,.2)}

/* contract preview */
.cdoc{background:#faf7ef;color:#1a1a2e;border-radius:var(--radius);padding:34px 38px;font-family:'Inter',system-ui,sans-serif;font-size:12px;line-height:1.62;max-height:74vh;overflow:auto}
.cdoc h2.ct{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:.03em;color:#0f3460;margin-bottom:2px}
.cdoc .csub{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#6b6b7a;margin-bottom:22px;border-bottom:1px solid #d9d4c6;padding-bottom:14px}
.cdoc h3.cs{font-size:12.5px;font-weight:600;color:#0f3460;margin:18px 0 6px;letter-spacing:.01em}
.cdoc h3.cs .n{color:#1a1a2e}
.cdoc p{margin:0 0 9px}
.cdoc ul{margin:4px 0 10px;padding-left:20px}
.cdoc li{margin-bottom:4px}
.cdoc .ctable{width:100%;border-collapse:collapse;margin:6px 0 12px}
.cdoc .ctable td{border:1px solid #cfcabb;padding:6px 9px;font-size:11.5px}
.cdoc .ctable td.k{background:#eef0f6;font-weight:600;width:38%}
.cdoc b{font-weight:600}
.cdoc .sig{margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:30px}
.cdoc .sigblock{border-top:1px solid #1a1a2e;padding-top:6px;font-size:10.5px;font-family:'Space Mono',monospace;letter-spacing:.04em}

/* section toggle list (contract controls) */
.sectog{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.sectog:last-child{border-bottom:none}
.sectog .st-n{font-family:var(--mono);font-size:10px;color:var(--amber-dim);width:18px}
.sectog .st-t{flex:1;font-size:12.5px}
.sectog.off .st-t{color:var(--muted-2)}
.sectog .sw{width:30px;height:17px}
.sectog .sw::after{width:11px;height:11px}
.sectog .sw.on::after{transform:translateX(13px)}

/* invoice specifics */
.invrow{display:grid;grid-template-columns:1fr 80px 30px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.invrow:last-of-type{border-bottom:none}
.invrow .inp{padding:6px 8px;font-size:12px}
.paidtag{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:100px;cursor:pointer;user-select:none}
.paidtag.paid{background:var(--green-soft);color:var(--green);border:1px solid var(--green)}
.paidtag.due{background:var(--red-soft);color:var(--red);border:1px solid var(--red)}

/* toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface-3);border:1px solid var(--line-2);color:var(--ink);font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;padding:11px 18px;border-radius:7px;opacity:0;pointer-events:none;transition:.22s;z-index:100}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* empty state */
.empty{text-align:center;padding:40px 20px;color:var(--muted-2);font-family:var(--mono);font-size:11px;letter-spacing:.06em;line-height:1.9}
.empty .big{font-family:var(--display);font-size:34px;color:var(--line-2);letter-spacing:.06em;display:block;margin-bottom:6px}

/* inquiry reference panel */
.inq-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:flex;justify-content:flex-end;backdrop-filter:blur(2px)}
.inq-overlay.hidden{display:none}
.inq-panel{width:420px;max-width:100%;height:100%;background:var(--surface);display:flex;flex-direction:column;overflow:hidden;box-shadow:-8px 0 40px rgba(0,0,0,.5)}
.inq-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;background:var(--surface-2);flex-shrink:0}
.inq-head .t{font-family:var(--display);font-size:20px;letter-spacing:.04em;color:var(--ink)}
.inq-head .ref{font-family:var(--mono);font-size:11px;color:var(--muted-2);margin-top:2px}
.inq-close{width:30px;height:30px;border-radius:5px;border:1px solid var(--line-2);background:transparent;color:var(--muted);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.14s;flex-shrink:0;line-height:1}
.inq-close:hover{background:var(--amber-soft);border-color:var(--amber-dim);color:var(--ink)}
.inq-body{flex:1;overflow-y:auto;padding:18px 20px}
.inq-sec{margin-bottom:18px}
.inq-sec-t{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:7px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.inq-sec-t::before{content:"// ";color:var(--amber-dim)}
.inq-row{display:grid;grid-template-columns:100px 1fr;gap:8px;padding:3px 0;font-size:12.5px}
.inq-row .l{color:var(--muted);font-family:var(--mono);font-size:11px}
.inq-row .v{color:var(--ink);word-break:break-word}
.inq-notes{font-size:12.5px;color:var(--ink);line-height:1.6;font-style:italic}
.inq-empty{text-align:center;padding:30px 20px;color:var(--muted-2);font-family:var(--mono);font-size:11px}

.presentation .no-present{display:none!important}

/* print */
@media print{
  .topbar,.stagenav,.controls-col,.no-print,.actions{display:none!important}
  body{background:#fff}
  .stage{padding:0;max-width:none}
  .stage:not(.active){display:none}
  .split{display:block}
  .doc,.cdoc{position:static;border:none;box-shadow:none;max-height:none;border-radius:0}
  .doc{background:#fff;color:#111}
  .doc .li .ln,.doc .li .lp,.doc .tl-line .v,.doc .doc-head .dt,.doc .doc-head .dmeta{color:#111}
  .doc .sched{background:#f4f1ea;border-color:#d9d4c6}
  .doc .sched .sk,.doc .sched .sk b,.doc .sched .sv,.doc .sched-h{color:#111!important}
  .doc input,.doc .pedit{color:#111!important;border:none!important;background:transparent!important;-webkit-appearance:none;appearance:none;width:auto;padding:0}
  .li .rst,.li .ovrdot{display:none!important}
  .cdoc{padding:0}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="mark">CARRIAGE HOUSE</span>
      <span class="sub">Booking Portal</span>
    </div>
    <span class="ref-chip" id="refChip">CH-0000</span>
    <div class="topbar-spacer"></div>
    <div class="iobar">
      <button class="io-btn" onclick="Portal.newDeal()">New deal</button>
      <button class="io-btn" onclick="Portal.exportJSON()">Save file</button>
      <button class="io-btn" onclick="document.getElementById('importFile').click()">Load file</button>
      <button class="io-btn" id="presentBtn" onclick="Portal.togglePresent()">Present</button>
      <input type="file" id="importFile" accept="application/json" style="display:none" onchange="Portal.importJSON(event)">
    </div>
    <div class="iobar" id="hubbar"></div>
  </div>
  <div class="stagenav">
    <button class="stage-tab active" data-stage="quote" onclick="Portal.go('quote')"><span class="idx">01</span> Quote</button>
    <button class="stage-tab" data-stage="contract" onclick="Portal.go('contract')"><span class="idx">02</span> Contract</button>
    <button class="stage-tab" data-stage="invoice" onclick="Portal.go('invoice')"><span class="idx">03</span> Invoice</button>
  </div>
</div>

<!-- ===================== QUOTE ===================== -->
<section class="stage active" id="stage-quote">
  <div class="split">
    <div class="controls-col" id="quoteControls"></div>
    <div class="doc-col"><div class="doc" id="quoteDoc"></div></div>
  </div>
</section>

<!-- ===================== CONTRACT ===================== -->
<section class="stage" id="stage-contract">
  <div class="split">
    <div class="controls-col" id="contractControls"></div>
    <div class="doc-col"><div id="contractDoc"></div></div>
  </div>
</section>

<!-- ===================== INVOICE ===================== -->
<section class="stage" id="stage-invoice">
  <div class="split">
    <div class="controls-col" id="invoiceControls"></div>
    <div class="doc-col"><div class="doc" id="invoiceDoc"></div></div>
  </div>
</section>

<div class="inq-overlay hidden" id="inqOverlay" onclick="if(event.target===this) Hub.toggleInquiryPanel()">
  <div class="inq-panel">
    <div class="inq-head">
      <div><div class="t" id="inqPanelName">Inquiry</div><div class="ref" id="inqPanelRef"></div></div>
      <button class="inq-close" onclick="Hub.toggleInquiryPanel()">&times;</button>
    </div>
    <div class="inq-body" id="inqBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const Portal = (function(){
"use strict";

/* ---------------- config ---------------- */
const TIERS = [
  {id:'t50',  label:'Up to 50 guests', rate:3000},
  {id:'t150', label:'Up to 150 guests', rate:4500},
  {id:'t300', label:'Full venue (up to 300)', rate:6500}
];
const INCLUDED_HOURS = 6, EXTRA_HOUR_RATE = 400, LOADIN_RATE = 250;

/* ---------------- helpers ---------------- */
const $ = id => document.getElementById(id);
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt0 = n => '$'+Math.round(n||0).toLocaleString('en-US');
const fmt2 = n => '$'+(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const num = v => { const n=parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; };
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function parseDate(s){ if(!s) return null; const p=s.split('-'); if(p.length!==3) return null; return new Date(+p[0],+p[1]-1,+p[2]); }
function longDate(d){ if(!d) return '—'; return DAYS[d.getDay()]+', '+MONTHS[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear(); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function dowInfo(dateStr){
  const d=parseDate(dateStr);
  if(!d) return {mult:1.0, label:'weekday'};
  const g=d.getDay();
  if(g===5) return {mult:1.25,label:'Friday'};
  if(g===6) return {mult:1.40,label:'Saturday'};
  if(g===0) return {mult:1.15,label:'Sunday'};
  return {mult:1.0,label:DAYS[g]};
}
function setPath(path,val){ const parts=path.split('.'); let o=S; for(let i=0;i<parts.length-1;i++) o=o[parts[i]]; o[parts[parts.length-1]]=val; }
function getPath(path){ const parts=path.split('.'); let o=S; for(const p of parts){ if(o==null) return undefined; o=o[p]; } return o; }

/* ---------------- calc engine ---------------- */
function computeLines(){
  const g=[], sub={venue:0,prod:0,staff:0};
  const tier = TIERS.find(t=>t.id===S.venue.tier)||TIERS[0];
  const dw = dowInfo(S.event.date);
  const hrs = num(S.event.hours);
  const customOn = (S.venue.customBase!=null && S.venue.customBase!=='');
  let base, baseNote;
  if(customOn){ base = num(S.venue.customBase); baseNote = 'Custom rental fee'; }
  else {
    base = tier.rate*dw.mult;
    if(hrs>INCLUDED_HOURS) base += (hrs-INCLUDED_HOURS)*EXTRA_HOUR_RATE;
    baseNote = tier.label+', '+hrs+' hrs, '+dw.label;
  }
  const push=(id,cat,label,note,computed,show=true)=>{
    if(!show) return;
    const ov = S.overrides[id];
    const price = (ov!=null && ov!=='')? num(ov): computed;
    g.push({id,cat,label,note,computed:Math.round(computed),price:Math.round(price),ovr:(ov!=null&&ov!=='')});
    sub[cat]+=Math.round(price);
  };
  push('venue-base','venue','Base rental', baseNote, base);
  push('venue-loadin','venue','Setup / load-in', num(S.event.loadInHours)+' hrs × $'+LOADIN_RATE, num(S.event.loadInHours)*LOADIN_RATE, num(S.event.loadInHours)>0);
  push('venue-cleaning','venue','Cleaning fee','', num(S.venue.cleaning), num(S.venue.cleaning)>0);
  if(S.sec.prod) S.prod.forEach(p=>{ if(p.on) push('prod-'+p.id,'prod',p.label,'', num(p.price)); });
  const sh=num(S.event.staffHours);
  if(S.sec.staff){
    S.staff.forEach(s=>{ push('staff-'+s.id,'staff',s.label, s.count+'×$'+s.rate+'/hr×'+sh+'hr', num(s.rate)*num(s.count)*sh, num(s.count)>0); });
    S.supplies.forEach(x=>{ push('sup-'+x.id,'staff',x.label,'', num(x.price), num(x.price)>0); });
  }
  return {lines:g, sub, dw, tier};
}
function quoteTotals(){
  const {lines,sub,dw,tier}=computeLines();
  const venueTotal=sub.venue, equipTotal=sub.prod, staffTotal=sub.staff;
  const pre = venueTotal+equipTotal+staffTotal;
  const discount=num(S.adj.discount), surcharge=num(S.adj.surcharge);
  const taxable = Math.max(0, pre - discount + surcharge);
  const taxRate = num(S.adj.taxRate)/100;
  const tax = taxable*taxRate;
  const grand = taxable + tax;
  let confirmed=0, potential=0;
  S.sponsors.forEach(sp=>{ const a=num(sp.amount); if(sp.status==='confirmed') confirmed+=a; else potential+=a; });
  const netConfirmed = Math.max(0, grand-confirmed);
  const netPotential = Math.max(0, grand-confirmed-potential);
  const depBase = confirmed>0? netConfirmed : grand;
  const deposit = (S.depositOverride!=null&&S.depositOverride!=='')? num(S.depositOverride) : Math.round(depBase*num(S.adj.depositPct)/100);
  return {lines,venueTotal,equipTotal,staffTotal,pre,discount,surcharge,tax,taxRate:num(S.adj.taxRate),grand:Math.round(grand),confirmed,potential,netConfirmed:Math.round(netConfirmed),netPotential:Math.round(netPotential),deposit,dw,tier};
}

function quoteTotalsHtml(t){
  let h='';
  h+=`<div class="tl-line"><span class="k">Subtotal</span><span class="v">${fmt0(t.pre)}</span></div>`;
  if(t.discount>0) h+=`<div class="tl-line disc"><span class="k">Discount / credit</span><span class="v">−${fmt0(t.discount)}</span></div>`;
  if(t.surcharge>0) h+=`<div class="tl-line add"><span class="k">Additional charge</span><span class="v">+${fmt0(t.surcharge)}</span></div>`;
  if(t.tax>0) h+=`<div class="tl-line"><span class="k">Tax / service (${t.taxRate}%)</span><span class="v">${fmt0(t.tax)}</span></div>`;
  h+=`<div class="tl-line grand"><span class="k">Total</span><span class="v">${fmt0(t.grand)}</span></div>`;
  if(t.confirmed>0){ h+=`<div class="tl-line sponsor"><span class="k">Net (confirmed sponsors)</span><span class="v">${fmt0(t.netConfirmed)}</span></div>`; }
  if(t.potential>0){ h+=`<div class="tl-line sponsor"><span class="k">Net (all sponsors)</span><span class="v">${fmt0(t.netPotential)}</span></div>`; }
  // deposit schedule preview
  const credited = S.adj.depositCredited!==false;
  const total = t.confirmed>0? t.netConfirmed : t.grand;
  const dep = t.deposit;
  const half = Math.round(total/2);
  const bal = credited ? Math.max(0, total - dep - half) : Math.max(0, total - half);
  h+=`<div class="sched">
    <div class="sched-h">Payment schedule (preview)</div>
    <div class="sched-r"><span class="sk"><b>Security deposit</b> — on signing, ${credited?'credited to total':'refundable / held'} <span style="position:relative;top:0"><input class="pedit" style="width:66px;color:var(--amber)" value="${dep.toLocaleString('en-US')}" oninput="Portal.depEdit(this.value)"></span></span><span class="sv">${fmt0(dep)}</span></div>
    <div class="sched-r"><span class="sk"><b>Half of total</b> — 14 days after signing</span><span class="sv">${fmt0(half)}</span></div>
    <div class="sched-r"><span class="sk"><b>Balance</b> — 14 days before event</span><span class="sv">${fmt0(bal)}</span></div>
    ${credited?'':`<div class="tl-note" style="margin-top:6px">Deposit is additional to the total (client pays ${fmt0(total+dep)}) and refunded after the event.</div>`}
  </div>`;
  return h;
}

function quotePlainText(){
  const t=quoteTotals();
  const L=[];
  L.push('QUOTE — 170 ELDRIDGE LLC / CARRIAGE HOUSE');
  L.push('Reference: '+S.deal.ref);
  if(S.event.name) L.push('Event: '+S.event.name);
  if(S.client.name) L.push('Client: '+S.client.name+(S.client.company?' ('+S.client.company+')':''));
  if(S.event.date) L.push('Date: '+longDate(parseDate(S.event.date)));
  L.push('');
  const cat=(title,c,subv)=>{ L.push('── '+title.toUpperCase()+' '.padEnd(1)+'— '+fmt0(subv)); t.lines.filter(l=>l.cat===c).forEach(l=>{ L.push('   '+l.label+(l.note?' ('+l.note+')':'')+'  '+fmt0(l.price)); }); };
  cat('Venue rental','venue',t.venueTotal);
  if(S.sec.prod) cat('Production & equipment','prod',t.equipTotal);
  if(S.sec.staff) cat('Staff & supplies','staff',t.staffTotal);
  L.push('');
  if(t.discount>0) L.push('DISCOUNT: −'+fmt0(t.discount));
  if(t.surcharge>0) L.push('ADDITIONAL: +'+fmt0(t.surcharge));
  if(t.tax>0) L.push('TAX / SERVICE ('+t.taxRate+'%): '+fmt0(t.tax));
  L.push('TOTAL: '+fmt0(t.grand));
  if(t.confirmed>0) L.push('NET (CONFIRMED SPONSORS): '+fmt0(t.netConfirmed));
  if(t.potential>0) L.push('NET (ALL SPONSORS): '+fmt0(t.netPotential));
  const credited=S.adj.depositCredited!==false;
  const total=t.confirmed>0?t.netConfirmed:t.grand, half=Math.round(total/2);
  const bal= credited? Math.max(0,total-t.deposit-half) : Math.max(0,total-half);
  L.push('');
  L.push('PAYMENT SCHEDULE');
  L.push('  Security deposit ('+(credited?'credited to total':'refundable / held separately')+', on signing): '+fmt0(t.deposit));
  L.push('  Half of total (14 days after signing): '+fmt0(half));
  L.push('  Balance (14 days before event): '+fmt0(bal));
  if(!credited) L.push('  Note: deposit is additional to the total; client pays '+fmt0(total+t.deposit)+', deposit refunded after event.');
  L.push('');
  L.push(S.contract.venueAddress);
  L.push('Estimate only. Not binding until countersigned.');
  return L.join('\n');
}
function copyQuote(){ navigator.clipboard.writeText(quotePlainText()).then(()=>toast('Quote copied to clipboard')); }

/* ================= CONTRACT ================= */
function contractCtx(){
  const qt=quoteTotals();
  const baseTotal = qt.confirmed>0? qt.netConfirmed : qt.grand;
  const c=S.contract;
  const total = (c.totalOverride!=null&&c.totalOverride!=='')? num(c.totalOverride): baseTotal;
  const deposit = (c.depositOverride!=null&&c.depositOverride!=='')? num(c.depositOverride): Math.round(total*num(c.depositPct)/100);
  const credited = S.adj.depositCredited!==false;
  const half = Math.round(total/2);
  const balance = credited ? Math.max(0, total-deposit-half) : Math.max(0, total-half);
  const signD = parseDate(c.signDate);
  const halfD = signD? addDays(signD, num(c.installDays)) : null;
  const eventD = parseDate(S.event.date);
  const balanceD = eventD? addDays(eventD, -num(c.balanceLeadDays)) : null;
  return { total, deposit, half, balance, credited, signD, halfD, eventD, balanceD,
    clientPays: credited? total : total+deposit,
    dow:dowInfo(S.event.date), guests:(c.guestCap||S.event.guests),
    t1:num(c.cancTier1), t2:num(c.cancTier2), half50:Math.round(total/2), qtIsOverride:(c.totalOverride!=null&&c.totalOverride!=='') };
}

/* ---- time helpers ---- */
function to24(t){
  if(!t) return null;
  t=String(t).trim();
  let m=t.match(/^(\d{1,2}):(\d{2})\s*([AaPp])\.?[Mm]\.?$/);
  if(m){ let h=+m[1]%12; if(/[Pp]/.test(m[3])) h+=12; return String(h).padStart(2,'0')+':'+m[2]; }
  m=t.match(/^(\d{1,2})\s*([AaPp])\.?[Mm]\.?$/);
  if(m){ let h=+m[1]%12; if(/[Pp]/.test(m[2])) h+=12; return String(h).padStart(2,'0')+':00'; }
  m=t.match(/^(\d{1,2}):(\d{2})$/);
  if(m) return String(+m[1]).padStart(2,'0')+':'+m[2];
  return null;
}
function pretty(t){
  const t24=to24(t); if(!t24) return t||'';
  let [h,mi]=t24.split(':').map(Number);
  const ap=h>=12?'PM':'AM'; h=h%12||12;
  return h+':'+String(mi).padStart(2,'0')+' '+ap;
}
function hoursBetween(a,b){
  const A=to24(a), B=to24(b); if(!A||!B) return null;
  const [ah,am]=A.split(':').map(Number), [bh,bm]=B.split(':').map(Number);
  let d=(bh*60+bm)-(ah*60+am); if(d<=0) d+=1440;
  return Math.round((d/60)*10)/10;
}
function addDay(dateStr){ const d=new Date(dateStr+'T12:00:00'); d.setDate(d.getDate()+1); return d.toISOString().slice(0,10); }
/* DST-safe RFC3339 for America/New_York */
function isoNY(dateStr, timeStr){
  const t=to24(timeStr); if(!dateStr||!t) return null;
  const naive=new Date(`${dateStr}T${t}:00`);
  const nyc=new Date(naive.toLocaleString('en-US',{timeZone:'America/New_York'}));
  const offMs=naive.getTime()-nyc.getTime();
  const sign=offMs>=0?'-':'+';
  const hrs=Math.round(Math.abs(offMs)/36e5);
  return `${dateStr}T${t}:00${sign}${String(hrs).padStart(2,'0')}:00`;
}

/* ---- PDF from plain text (jsPDF) ---- */
// Renders the actual on-screen document (not a plain-text reconstruction) into a
// paginated PDF. Reuses the same rules as the app's own @media print stylesheet
// (via onclone) so the emailed PDF matches what "Print / PDF" already produces.
// Pulls the app's own @media print rules verbatim from the stylesheet, so the
// emailed PDF always matches whatever "Print / PDF" currently does -- no
// hand-copied CSS to keep in sync.
function getPrintCssText(){
  for(const sheet of document.styleSheets){
    let rules;
    try{ rules = sheet.cssRules; }catch(e){ continue; }
    if(!rules) continue;
    for(const rule of rules){
      if(rule.media && rule.media.mediaText && rule.media.mediaText.includes('print')){
        return [...rule.cssRules].map(r=>r.cssText).join('\n');
      }
    }
  }
  return '';
}
async function pdfFromElement(elId){
  if(!window.html2canvas) throw new Error('html2canvas not loaded');
  if(!window.jspdf || !window.jspdf.jsPDF) throw new Error('jsPDF not loaded');
  const src = document.getElementById(elId);
  if(!src) throw new Error('Nothing to export yet.');
  const printCss = getPrintCssText();
  const canvas = await html2canvas(src, {
    scale: 2,
    backgroundColor: '#ffffff',
    useCORS: true,
    onclone: (clonedDoc, clonedEl) => {
      if(printCss){
        const style = clonedDoc.createElement('style');
        style.textContent = printCss;
        clonedDoc.head.appendChild(style);
      }
      clonedEl.style.maxHeight = 'none';
      clonedEl.style.overflow = 'visible';
    },
  });
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit:'pt', format:'letter' });
  const M = 28;
  const pageW = pdf.internal.pageSize.getWidth() - M*2;
  const pageH = pdf.internal.pageSize.getHeight() - M*2;
  const imgW = pageW;
  const imgH = canvas.height * (imgW / canvas.width);
  const imgData = canvas.toDataURL('image/png');
  let heightLeft = imgH, position = M;
  pdf.addImage(imgData, 'PNG', M, position, imgW, imgH);
  heightLeft -= pageH;
  while(heightLeft > 0){
    position -= pageH;
    pdf.addPage();
    pdf.addImage(imgData, 'PNG', M, position, imgW, imgH);
    heightLeft -= pageH;
  }
  return pdf.output('datauristring').split(',')[1];
}

    start:{date:S.event.date}, end:{date:S.event.date},
    status:'tentative', transparency:'opaque',
  };
  const r=await fetch(`https://www.googleapis.com/calendar/v3/calendars/${CAL_ID}/events`,{
    method:'POST', headers:{Authorization:`Bearer ${token()}`,'Content-Type':'application/json'},
    body:JSON.stringify(body)});
  if(!r.ok){ const e=await r.json().catch(()=>({})); throw new Error('Calendar: '+(e.error?.message||r.status)); }
  return r.json();
}
async function patchHold(){
  const S=Portal._S();
  const eventId=ctx.calendarEventId;
  if(!eventId) throw new Error('No calendar hold exists yet. Email the quote first to create one.');
  const date=S.event.date;
  if(!date) throw new Error('Set an event date first.');
  const startT=S.contract.accessFrom || S.contract.admissionOpen;
  const endT  =S.contract.accessUntil || S.contract.vacateTime;
  const startISO=isoNY(date,startT);
  let endDate=date;
  const s24=to24(startT), e24=to24(endT);
  if(s24 && e24 && e24<=s24) endDate=addDay(date);
  const endISO=isoNY(endDate,endT);
  if(!startISO||!endISO) throw new Error('Could not read access times. Use a format like "5:00 PM".');
  const x=Portal._contractCtx();
  const description=[
    `Client: ${S.client.name||'TBD'}`,
    `Event: ${S.event.name||'Private Event'}`,
    S.event.guests?`Guests: up to ${S.event.guests}`:null,
    `Total: $${x.total.toLocaleString('en-US')}`,
    '',
    `Doors open:  ${S.contract.admissionOpen||'—'}`,
    `Doors close: ${S.contract.admissionClose||'—'}`,
    '',
    'Updated via Carriage House Portal',
  ].filter(l=>l!==null).join('\n');
  const r=await fetch(`https://www.googleapis.com/calendar/v3/calendars/${CAL_ID}/events/${encodeURIComponent(eventId)}`,{
    method:'PATCH', headers:{Authorization:`Bearer ${token()}`,'Content-Type':'application/json'},
    body:JSON.stringify({
      summary:`${S.client.name||'Client'} — ${S.event.name||'Private Event'}`,
      description,
      start:{dateTime:startISO,timeZone:'America/New_York'},
      end:{dateTime:endISO,timeZone:'America/New_York'},
    })});
  if(!r.ok){ const e=await r.json().catch(()=>({})); throw new Error('Calendar: '+(e.error?.message||r.status)); }
  return r.json();
}

/* ---- Gmail draft ---- */
function emailShell(inner){
  return `<div style="font-family:Arial,Helvetica,sans-serif;max-width:600px;color:#1a1816">
  <div style="background:#0e0d0a;padding:32px 36px;margin-bottom:24px">
    <div style="font-family:'Arial Narrow',Arial,Helvetica,sans-serif;font-weight:700;font-size:22px;letter-spacing:.08em;text-transform:uppercase;color:#f2ede1">Carriage House</div>
  </div>
  <div style="padding:0 8px">${inner}
    <div style="border-top:1px solid #e6e2d6;padding-top:16px;margin-top:24px;font-size:12px;color:#6b6353">
      <strong style="color:#1a1816">Carriage House</strong><br>170 Eldridge Street, New York, NY 10002<br>
      <a href="https://carriagehouse.nyc" style="color:#a87524">carriagehouse.nyc</a>
    </div>
  </div></div>`;
}
// RFC 2047 encoded-word: MIME headers must stay 7-bit ASCII. Non-ASCII values
// (accented names, punctuation) need this or they render as mojibake in the client.
function encodeMimeHeader(str){
  if(/^[\x00-\x7F]*$/.test(str)) return str; // pure ASCII, nothing to do
  return '=?UTF-8?B?' + btoa(unescape(encodeURIComponent(str))) + '?=';
}
async function gmailDraft(to, subject, html, fileName, base64){
  if(!to) throw new Error('No client email on this inquiry.');
  const b='b_170e_'+Date.now();
  const lines=[
    'MIME-Version: 1.0',
    `To: ${to}`,
    `Subject: ${encodeMimeHeader(subject)}`,
    `Content-Type: multipart/mixed; boundary="${b}"`,'',
    `--${b}`,'Content-Type: text/html; charset="UTF-8"','',html,'',
    `--${b}`,`Content-Type: application/pdf; name="${fileName}"`,
    'Content-Transfer-Encoding: base64',
    `Content-Disposition: attachment; filename="${fileName}"`,'',base64,'',
    `--${b}--`,
  ].join('\r\n');
  const raw=btoa(unescape(encodeURIComponent(lines))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  const r=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/drafts',{
    method:'POST', headers:{Authorization:`Bearer ${token()}`,'Content-Type':'application/json'},
    body:JSON.stringify({message:{raw}})});
  if(!r.ok){ const e=await r.json().catch(()=>({})); throw new Error('Gmail: '+(e.error?.message||r.status)); }
  return r.json();
}
function longDate(d){ return d? new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}) : 'your event date'; }

/* ---- handoff to hub ---- */
function handoff(key, payload){
  sessionStorage.setItem(key, JSON.stringify(payload));
  const p=prefill()||{};
  p.portalState=Portal._S();
  p.calendarEventId=ctx.calendarEventId||'';
  sessionStorage.setItem('170e_prefill', JSON.stringify(p));
  window.location.href='index.html';
}
function requireHub(){ if(!ctx.active){ alert('Open this from the hub to save to the Sheet.'); return false; } return true; }

/* ---- actions ---- */
async function saveQuote(withEmail){
  if(!requireHub()) return;
  const S=Portal._S();
  let calendarEventId=ctx.calendarEventId||'';
  if(withEmail){
    if(!token()){ alert('Not signed in. Return to the hub and sign in.'); return; }
    busy('Creating hold & drafting email…');
    try{
      const t=Portal._quoteTotals();
      const pdfB64 = await pdfFromElement('quoteDoc');
      const [cal]=await Promise.all([
        calendarEventId?Promise.resolve({id:calendarEventId}):createHold(),
        gmailDraft(
          S.client.email,
          `Carriage House: Quote for ${S.event.name||'Your Event'} on ${longDate(S.event.date)}`,
          emailShell(`<p style="margin:0 0 16px">Hi ${esc((S.client.name||'').split(' ')[0]||'there')},</p>
            <p style="margin:0 0 16px">Here's the quote for <strong>${esc(S.event.name||'your event')}</strong> on <strong>${longDate(S.event.date)}</strong>.</p>
            <div style="background:#fbf6ec;border:1px solid #e6d9bd;padding:20px 22px;margin:0 0 16px">
              <div style="font-family:'Courier New',Courier,monospace;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#a87524;margin-bottom:12px">Quote Summary</div>
              <div style="font-size:14px;margin-bottom:6px">Guests: <strong>${esc(S.event.guests||'-')}</strong></div>
              <div style="font-size:16px;border-top:1px dotted #d9c9a3;padding-top:10px;margin-top:10px">Total: <strong style="color:#a87524">$${t.grand.toLocaleString('en-US')}</strong></div>
            </div>
            <p style="margin:0 0 16px">This is a starting point, not a fixed number. If the budget doesn't line up, we can adjust guest count, production, or the date.</p>
            <p style="margin:0 0 16px">Let me know if you'd like to go through it, or if anything needs changing. We can also hop on a call or set up a walkthrough if that's easier.</p>
            <p style="margin:0 0 4px">Best,</p>
            <p style="margin:0 0 4px">Lucas</p>
            <p style="margin:0">(978) 879-3364</p>`),
          `170_Eldridge_Quote_${(S.client.name||'Client').replace(/\s+/g,'_')}.pdf`,
          pdfB64
        ),
      ]);
      if(cal&&cal.id) calendarEventId=cal.id;
    }catch(err){ busy(''); alert('Quote will still be saved, but: '+err.message); }
    busy('');
  }
  handoff('170e_quote_result',{
    rowIndex:ctx.rowIndex, refId:ctx.refId,
    grandTotal:Portal._quoteTotals().grand,
    quoteDataJson:quoteDataJson(),
    calendarEventId,
  });
}
async function saveContract(withEmail){
  if(!requireHub()) return;
  const S=Portal._S();
  if(withEmail){
    if(!token()){ alert('Not signed in. Return to the hub and sign in.'); return; }
    busy('Updating hold & drafting email…');
    try{
      await patchHold();
      const x=Portal._contractCtx();
      const pdfB64 = await pdfFromElement('contractDoc');
      await gmailDraft(
        S.client.email,
        `Carriage House: Rental Agreement for ${S.event.name||'Your Event'}`,
        emailShell(`<p style="margin:0 0 16px">Hi ${esc((S.client.name||'').split(' ')[0]||'there')},</p>
          <p style="margin:0 0 16px">Here's the rental agreement for <strong>${esc(S.event.name||'your event')}</strong> on <strong>${longDate(S.event.date)}</strong>.</p>
          <div style="background:#fbf6ec;border:1px solid #e6d9bd;padding:20px 22px;margin:0 0 16px">
            <div style="font-size:14px;margin-bottom:6px">Total: <strong style="color:#a87524">$${x.total.toLocaleString('en-US')}</strong></div>
            <div style="font-size:14px">Security deposit: <strong>$${x.deposit.toLocaleString('en-US')}</strong> ${x.credited?'(credited to total)':'(refundable)'}</div>
          </div>
          <p style="margin:0 0 16px">Review, sign, and send it back whenever you're ready. The deposit is due on signing to hold the date. We can also hop on a call or set up a walkthrough if anything needs discussing.</p>
          <p style="margin:0 0 4px">Best,</p>
          <p style="margin:0 0 4px">Lucas</p>
          <p style="margin:0">(978) 879-3364</p>`),
        `170_Eldridge_Agreement_${(S.client.name||'Client').replace(/\s+/g,'_')}.pdf`,
        pdfB64
      );
    }catch(err){ busy(''); alert('Contract will still be saved, but: '+err.message); }
    busy('');
  }
  handoff('170e_contract_result',{ rowIndex:ctx.rowIndex, refId:ctx.refId, quoteDataJson:quoteDataJson() });
}
function saveInvoice(){
  if(!requireHub()) return;
  const t=Portal._invoiceTotals();
  handoff('170e_invoice_result',{
    rowIndex:ctx.rowIndex, refId:ctx.refId,
    invoiceTotal:t.items, invoiceDataJson:invoiceDataJson(), quoteDataJson:quoteDataJson(),
  });
}
function backToHub(){ 
  const p=prefill(); 
  if(p){ p.portalState=Portal._S(); sessionStorage.setItem('170e_prefill',JSON.stringify(p)); }
  window.location.href='index.html';
}

/* ---- inquiry reference panel ---- */
function toggleInquiryPanel(){
  const ov=gid('inqOverlay'); if(!ov) return;
  const opening = ov.classList.contains('hidden');
  if(opening) renderInquiryPanel();
  ov.classList.toggle('hidden', !opening);
}
function renderInquiryPanel(){
  const inq = ctx.inquiry || {};
  const sec = (title, rows) => {
    const filtered = rows.filter(([,v])=>v);
    if(!filtered.length) return '';
    return `<div class="inq-sec"><div class="inq-sec-t">${esc(title)}</div>${filtered.map(([l,v])=>`<div class="inq-row"><span class="l">${esc(l)}</span><span class="v">${esc(v)}</span></div>`).join('')}</div>`;
  };
  const dateStr = inq.eventDate ? new Date(inq.eventDate+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'}) : '';
  const body = [
    sec('Contact', [
      ['Name', [inq.firstName,inq.lastName].filter(Boolean).join(' ')],
      ['Email', inq.email],
      ['Phone', inq.phone],
      ['Company', inq.company],
      ['Referred by', inq.referral],
    ]),
    sec('Event', [
      ['Type', inq.eventType],
      ['Date', dateStr],
      ['Doors open', inq.doorsOpen],
      ['Doors close', inq.doorsClose],
      ['Guests', inq.guestCount ? inq.guestCount+' guests' : ''],
      ['Rooftop', inq.rooftop],
    ]),
    sec('Logistics', [
      ['Services', inq.servicesNeeded],
      ['Door staff', inq.doorStaff],
      ['Outside vendors', inq.outsideVendors],
      ['Guest method', inq.guestMethod],
      ['Public event', inq.publicEvent],
      ['Alcohol', inq.alcohol],
      ['Age req.', inq.ageReq],
      ['Insurance', inq.insurance],
    ]),
    sec('Budget', [
      ['Range', inq.budget],
      ['Payment', inq.payMethod],
    ]),
    inq.notes ? `<div class="inq-sec"><div class="inq-sec-t">Notes</div><div class="inq-notes">${esc(inq.notes)}</div></div>` : '',
  ].join('') || '<div class="inq-empty">No inquiry data on file.</div>';
  const name = [inq.firstName,inq.lastName].filter(Boolean).join(' ') || 'Inquiry';
  gid('inqPanelName').textContent = name;
  gid('inqPanelRef').textContent = ctx.refId || '';
  gid('inqBody').innerHTML = body;
}

/* ---- UI ---- */
let busyMsg='';
function busy(m){ busyMsg=m; renderBar(); }
function renderBar(){
  const bar=gid('hubbar'); if(!bar) return;
  if(!ctx.active){ bar.innerHTML=''; return; }
  const stage=Portal._S().stage;
  if(busyMsg){ bar.innerHTML=`<span class="ref-chip">${esc(busyMsg)}</span>`; return; }
  let btns=`<button class="io-btn" onclick="Hub.backToHub()">← Hub</button>`;
  if(ctx.inquiry && Object.keys(ctx.inquiry).length){
    btns+=`<button class="io-btn" onclick="Hub.toggleInquiryPanel()">Inquiry</button>`;
  }
  if(stage==='quote'){
    btns+=`<button class="io-btn" onclick="Hub.saveQuote(false)">Save to Hub</button>
           <button class="io-btn" onclick="Hub.saveQuote(true)">Email quote + hold</button>`;
  } else if(stage==='contract'){
    btns+=`<button class="io-btn" onclick="Hub.saveContract(false)">Save contract</button>
           <button class="io-btn" onclick="Hub.saveContract(true)">Email contract + update hold</button>`;
  } else {
    btns+=`<button class="io-btn" onclick="Hub.saveInvoice()">Save invoice to Hub</button>`;
  }
  const u=user();
  bar.innerHTML=btns+(u?`<span class="ref-chip" title="Signed in">${esc(u)}</span>`:'');
}

/* ---- start ---- */
function start(){
  const p=prefill();
  if(!p || p.source!=='hub'){ Portal._init(); renderBar(); return; }
  ctx={active:true, rowIndex:p.rowIndex, refId:p.refId||'', token:p.token||'',
       calendarEventId:p.calendarEventId||'', inquiry:p.inquiry||{}};
  if(p.token) sessionStorage.setItem('170e_token', p.token);

  const saved = p.portalState || (p.quote && p.quote.portalState) || null;
  let state = saved ? saved : mapInquiry(ctx.inquiry);
  // Deep-merge a saved invoice from the Sheet if the portal state predates it
  if(!saved && p.invoice && p.invoice.items){
    state.invoice = Object.assign(state.invoice, {
      number:p.invoice.number||state.invoice.number, date:p.invoice.date||state.invoice.date,
      items:p.invoice.items||[], payments:p.invoice.payments||[], pulled:true,
    });
  }
  state.deal.ref = ctx.refId || state.deal.ref;
  Portal._load(state);
  if(p.stage) Portal.go(p.stage);
  renderBar();
}

// keep the bar in sync when the user switches stages
const _go = Portal.go;
Portal.go = function(s){ _go(s); renderBar(); };

return { start, renderBar, onRender:renderBar, saveQuote, saveContract, saveInvoice, backToHub, toggleInquiryPanel, _ctx:()=>ctx, _to24:to24, _hoursBetween:hoursBetween, _isoNY:isoNY, _pdfFromElement:pdfFromElement, _getPrintCssText:getPrintCssText };
})();
window.Hub = Hub;
Hub.start();


</script>
